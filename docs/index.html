// ===== イベントボーナス =====
const arr5=s=>{const a=String(s||'').split(/[,\s、]+/).filter(x=>x!=='').map(Number);if(!a.length)return null;while(a.length<5)a.push(a[a.length-1]);return a};
function ruleMatch(r,c,kind){
  if(r.target!=='both'&&r.target!==kind)return false;
  let any=false;
  if(r.card){any=true;const nz=x=>String(x||'').normalize('NFKC');if(!nz(c.name).includes(nz(r.card)))return false}
  if(r.chara){any=true;if(c.chara!==r.chara)return false}
  if(r.band){any=true;if(c.band!==r.band)return false}
  if(r.type){any=true;if(c.type!==r.type)return false}
  return any;
}
function evBonus(c,kind){
  const idx=Math.max(0,Math.min(4,kind==='member'?c.awak|0:c.lb|0));
  // メンバーのボーナス合計は pt に、スナップのボーナス合計はアイテムに掛かる
  const o={pt:0,item:0,param:0};const key=kind==='member'?'pt':'item';
  for(const r of state.event.rules){if(!ruleMatch(r,c,kind))continue;
    const b=arr5(r.bonus);if(b)o[key]+=b[idx]||0;
    const p=arr5(r.param);if(p)o.param+=p[idx]||0}
  return o;
}

// ===== 計算モデル =====
// slot総合力 = B × (1 + スナップ補正 + スナップのイベント%パラ + バンドアイテム + タイプリンク + 楽曲タイプ一致 + リーダースキル)
// B = 個人総合力 × (1 + メンバーのイベント%パラ)
// 予想スコア = K × 総合力 × (1 + Σ スキル% × 効果秒 / 曲の長さ)
let M=[],S=[],CTX=null;

// 例: 祥子31・合計632 → 3×(150＋60)=630（総合力詳細「キャラランク」と一致）
const lastLE=(t,k)=>{let v=0;for(const[a,b]of t)if(a<=k)v=b;return v};
function rankBonus(chara){const R=state.settings.charaRankLv||{};const tot=CHARAS.reduce((a,c)=>a+(+R[c]||1),0);
  return 3*(lastLE(CAT.curves.crank,+R[chara]||1)+lastLE(CAT.curves.ctotal,tot))}
// ch=true のときだけイベントのパラメータボーナス（総合力アップ）を効かせる。公式ヘルプ「パラメータボーナスはチャレンジライブのみで発動」
function prep(song,ch,gkMode){
  // チャレンジライブでは課題楽曲のタイプがイベントのタイプになる（ゲーム内表示で確認。微笑みの爆弾=紫苑→山吹扱い）
  const stype=(ch&&state.event?.type)?state.event.type:song.type;
  const st=state.settings, TL=st.typeLink/100, MT=st.musicType/100, TG=(st.tokui||0)/100, VIP=(st.vip||0)/100;
  M=state.members.filter(m=>!m.excl&&m.power>0).map(m=>{
    const band=CHARA_BAND[m.chara]||'';const c={...m,band};const ev=evBonus(c,'member');
    // パラメータ別の比率（P/T/V未入力なら1/3ずつ）。リーダースキルは単一パラメータ対象が多い
    const sum=(m.pP||0)+(m.pT||0)+(m.pV||0);
    const share=sum>0&&m.pP>0&&m.pT>0&&m.pV>0?{P:m.pP/sum,T:m.pT/sum,V:m.pV/sum}:{P:1/3,T:1/3,V:1/3};
    return{...c,ev,share,B:m.power*(1+(ch?ev.param:0)/100)+rankBonus(m.chara),sk:(m.skillPct||0)/100,sec:m.skillSec||0,
      bandItem:(st.bandItem[band]||0)/100,
      smatch:((stype==='all'||stype===m.type)?MT:0)*((m.awak|0)+1)+(song.band&&song.band===band?TG*((m.awak|0)+1):0),
      lead:(m.leader||[]).filter(l=>l.pct).map(l=>{const [k,v,v2]=String(l.cond).split(':');return{k,v,v2,s:l.stat||'all',p:l.pct/100}})};
  });
  S=state.snaps.filter(s=>!s.excl).map(s=>{const ev=evBonus(s,'snap');const pv=s.cP!=null&&s.cP!=='';return{...s,ev,c:(s.corr||0)/100,cv:pv?{P:s.cP/100,T:(s.cT||0)/100,V:(s.cV||0)/100}:null,evp:ch?ev.param/100:0,ext:s.ext||0,tl:(s.link===''||s.link==null)?TL*((s.lb|0)+1):s.link/100}});
  for(let i=0;i<5;i++)S.push({id:'none'+i,name:'（なし）',none:true,type:'',band:'',c:0,cv:null,evp:0,ext:0,tl:null,ev:{pt:0,item:0,param:0}});
  const gk=!!gkMode&&!!song.gkTypes?.length;
  // 撃奏: 区間の種類ごとの数（3区間）
  const gkCnt={COMBO:0,JUST:0,LUCK:0};if(gk)for(const t of song.gkTypes||[])gkCnt[t]=(gkCnt[t]||0)+1;
  CTX={gk,gkCnt,gkQ:(st.gkQ??162)/100,gkEff:st.gkEff||{COMBO:17,JUST:17,LUCK:11},gkBase:st.gkBase||{COMBO:0,JUST:32,LUCK:0},TL,VIP,SE:st.skillEff??0.5,K:song.K||1,T:Math.max(1,song.len||120),song,ch:!!ch,sb:song.sb,sw:song.sw,kf:song.kf||st.scoreAdj||1};
}
function leadPct(L,m){let p=0;for(const l of L.lead){if(l.k==='all'||(l.k==='type'&&m.type===l.v)||(l.k==='band'&&m.band===l.v)||(l.k==='chara'&&m.chara===l.v)||(l.k==='bandtype'&&m.band===l.v&&m.type===l.v2)||(l.k==='skill'&&m.liveKind===l.v)||(l.k==='geki'&&m.gekiKind===l.v))p+=l.p*(l.s==='all'?1:m.share[l.s])}return p}
function ev(t){
  const L=M[t.m[t.L]],{TL,VIP,K,T,SE,gk}=CTX;let P=0,Sk=0,pt=0,it=0,GB=0;const slots=[],ys=[];
  for(let i=0;i<5;i++){const m=M[t.m[i]],s=S[t.s[i]];
    const sc=s.cv?s.cv.P*m.share.P+s.cv.T*m.share.T+s.cv.V*m.share.V:s.c;
    const mult=1+VIP+sc+s.evp+m.bandItem+(s.type&&s.type===m.type?(s.tl||0):0)+m.smatch+leadPct(L,m);
    const sp=m.B*mult;P+=sp;
    const ext=(s.band&&s.band===m.band)?(s.extB!=null&&s.extB!==''?+s.extB:s.ext*2):s.ext;
    const sk=SE*m.sk*Math.min(m.sec+ext,T)/T;Sk+=sk;
    // bdon.moe モデル用: スキル%×(発動秒数/5秒)。延長した分も同じノーツ密度とみなす
    ys.push(m.sk*(m.sec+ext)/5);
    pt+=m.ev.pt+s.ev.pt;it+=m.ev.item+s.ev.item;
    // 撃奏サポート: その種類の区間でだけ効く。バンド一致で強化
    let gb=0;if(gk&&s.gkType&&CTX.gkCnt[s.gkType]){const pc=(s.band&&s.band===m.band)?s.gkPctB:s.gkPct;gb=(CTX.gkCnt[s.gkType]/3)*(pc/100)*((CTX.gkEff[s.gkType]??15)/100);GB+=gb}
    if(t.detail)slots.push({m,s,sp,ext,sk,mult,gb});
  }
  // 撃奏: 区間スコア＝区間比率×(1+サポート)、撃奏BONUS＝区間スコア×順位ボーナス率（1位）
  // 撃奏: 区間の種類ごとに強さ→勝ち度合い w を出し、サポート・JUST基礎・撃奏BONUSを w で効かせる
  let gkMul=1,gkLoseMul=1,QL=0,gkW={};
  if(gk){const st=state.settings,lo=st.gkLoseAt??5,hi=st.gkWinAt??9,qW=(st.gkQ??160)/100,qL=(st.gkQLose??75)/100,jd=(st.gkJudge??0)/100;GB=0;let QB=0;
    for(const ty in CTX.gkCnt){const c=CTX.gkCnt[ty];if(!c)continue;
      let str=0,g=0,nj=0,ja=0;
      for(let i=0;i<5;i++){const m=M[t.m[i]],s=S[t.s[i]];if(m.gekiKind===ty)str++;if(s.gkType===ty){str++;g+=((s.band&&s.band===m.band)?s.gkPctB:s.gkPct)/100*((CTX.gkEff[ty]??10)/100);if(ty==='JUST'&&s.gkJudge)nj++;if(ty==='JUST'&&s.gkJudgeAll)ja=Math.max(ja,((s.band&&s.band===m.band)?(st.gkJudgeAll??18):(st.gkJudgeAll??18)/2)/100)}}
      // 区間全体の判定強化: 1枚目は全量、2枚目以降は半分（微笑み実績4回の比較から）
      if(ty==='JUST'){let nja2=0;for(let i=0;i<5;i++)if(S[t.s[i]].gkJudgeAll)nja2++;g+=ja*(nja2?1+0.5*(nja2-1):0)}else g+=ja;
      // JUST数を直接増やすサポート（判定領域UP・JUST変換）は1枚でスコア+28%相当、強さも+1
      // JUST区間の伸びは撃奏スキルがJUSTのメンバー数でほぼ決まる（実績: 5人+0.61 / 4人+0.09〜0.18 / 2人+0.01）。判定系サポートは効果が見えなかった
      let jw=1;if(ty==='JUST'){let jm=0,nja=0;for(let i=0;i<5;i++){if(M[t.m[i]].gekiKind==='JUST')jm++;if(S[t.s[i]].gkJudgeAll)nja++}g+=((st.gkJustMem??10)/100)*Math.max(0,jm-3.5);
        // JUST区間の勝ちやすさ＝JUST数の稼ぎやすさ（JUSTスキル持ち＋区間全体の判定強化×1.5）。2以下はほぼ負け、6以上でほぼ1位（実績11回から）
        const js=jm+1.5*nja;jw=Math.max(0,Math.min(1,(js-2)/4));str=js}
      g+=nj*jd;
      // 勝敗は相手次第で強さからは読めない（強さ6で勝ち・9で負けの実績）。最適化は区間1位の前提で行い、負けた場合も併記する
      gkW[ty]={str,w:jw};GB+=(c/3)*g;QB+=(c/3)*(qL+(qW-qL)*jw);QL=(QL||0)+(c/3)*qL}
    gkMul=(1+GB)*(1+QB);gkLoseMul=(1+GB)*(1+QL)}
  let free=K*P*(1+Sk),sd=0;
  // フリー・チャレンジ: bdon.moe のモデル。スコア=総合力×(base+Σ x_π(k)×w_k)、メンバー順は120通り一様ランダム
  // 期待値=総合力×(base+x̄×W)、順番によるばらつき Var=(1/(n−1))Σ(x_i−x̄)²×Σ(w_k−w̄)²
  if(!gk&&CTX.sw){const w=CTX.sw,W=w.reduce((a,b)=>a+b,0),wb=W/5,yb=ys.reduce((a,b)=>a+b,0)/5;
    const vy=ys.reduce((a,y)=>a+(y-yb)**2,0)/4,vw=w.reduce((a,x)=>a+(x-wb)**2,0);
    free=P*(CTX.sb+yb*W)*CTX.kf;sd=P*Math.sqrt(vy*vw)*CTX.kf;Sk=yb*W/CTX.sb}
  // lo: 順番の悪いケース（下位およそ10%）でも出るスコア。ランク判定に使う
  const z=state.settings.orderZ??1.28;
  // 撃奏ライブ（bdon.moe のモデル）: スコア＝総合力/30万×(スキルなし理論値＋各撃奏スキル単独の増分)＋総合力×x̄×W。
  // 区間ごとに順位ボーナス%を差し替え、区間の種類別に実測補正（COMBO/LUCK/JUST）を掛ける。実測16回で誤差rms約9%
  if(gk&&CTX.song.gk2){const G=CTX.song.gk2,st=state.settings,KK={1:st.gk2C??1.3,2:st.gk2L??1.08,3:st.gk2J??0.7},LV=[.45,.55,.64,.73,1];
    const yb=ys.reduce((a,b)=>a+b,0)/5;
    const keys=[];for(let i=0;i<5;i++){const m=M[t.m[i]],s=S[t.s[i]];if(m.gs!=null)keys.push([m.gs+'|',m.gl?m.gl-1:(m.awak|0)]);
      if(s.gs!=null){const k1=s.gs+'|'+((s.band&&s.band===m.band)?1:0);keys.push([G.v[k1]?k1:s.gs+'|',s.lb|0])}}
    // JUST区間: 理論値は全てJUST判定。実際のJUST率αは区間全体の判定幅スナップ枚数で決まる（バンド一致1枚=0.5、不一致0.25。実測で2枚≈全JUST、0枚≈全PERFECT）
    let nj=0;for(let i=0;i<5;i++){const m=M[t.m[i]],s=S[t.s[i]];if(s.gkJudgeAll)nj+=(s.band&&s.band===m.band)?1:0.5}
    const al=Math.min(1,(st.gk2A0??0)+(st.gk2A1??0.5)*nj);
    const sec=(r,x,f)=>{const th=x[0]+x[1]*f;return r[0]===3&&x.length>3?al*th+(1-al)*(x[2]+x[3]*f):th};
    const at=rk=>{let base=G.b,inc=0;G.r.forEach((r,i)=>{const f=r[3][rk[i]-1]/r[3][0],k=KK[r[0]]??1;base+=sec(r,[r[1],r[2],r[4],r[5]],f)*k-(r[1]+r[2])});
      for(const [k,l] of keys){const v=G.v[k];if(!v)continue;v.forEach((x,i)=>{const r=G.r[i],f=r[3][rk[i]-1]/r[3][0];inc+=sec(r,x,f)*(KK[r[0]]??1)*LV[l]})}
      return P/300000*(base+inc)+P*yb*G.W*(base/G.b)};
    const win=at([1,1,1]),lose=at([2,2,2]);
    const mk={};for(let i=0;i<5;i++){const k=M[t.m[i]].gekiKind;if(k)mk[k]=(mk[k]||0)+1}
    return{P,Sk,GB,free,gkMul:win/free,gkW,gkLose:lose,score:win,sd:0,lo:win,hi:win,pt,it,slots,gk2:true,mk,nj}}
  return{P,Sk,GB,free,gkMul,gkW,gkLose:free*gkLoseMul,score:free*gkMul,sd,lo:(free-z*sd)*gkMul,hi:(free+z*sd)*gkMul,pt,it,slots};
}
// 予想スコアは ±margin% の幅で扱い、ランクは幅の下限（確実に届く値）で判定する
const lowF=()=>1-state.settings.margin/100, highF=()=>1+state.settings.margin/100;
function rankRaw(score,song){const T=CTX?.gk?song.gkThr:song.thr;let r=0;for(let i=1;i<RANKS.length;i++){const th=T?.[RANKS[i]];if(th>0&&score>=th)r=i}return r}
function rankOf(score,song){return rankRaw(score*lowF(),song)}
function value(obj,e,rank){
  const st=state.settings,R=RANKS[rank],boost=st.lb>0?st.lb*5:1;
  switch(obj){
    case'pt':return Math.floor((st.ptBase[R]||0)*(1+e.pt/100)*boost);
    case'item':return Math.floor((st.itemBase[R]||0)*(1+e.it/100)*boost);
    case'chpt':return Math.floor((st.chPtBase[R]||0)*st.chMult*(1+e.pt/100));
    case'chitem':return Math.floor((st.chItemBase[R]||0)*st.chMult*(1+e.it/100));
    // フリー1回の直接獲得 ＋ 得たチャレンジptをチャレンジライブで使ったときの価値（vpc=1ptあたり）
    case'ptTotal':return Math.floor(((st.ptBase[R]||0)*(1+e.pt/100)+(st.chGainBase[R]||0)*(CTX.vpc||0))*boost);
    case'itemTotal':return Math.floor(((st.itemBase[R]||0)*(1+e.it/100)+(st.chGainBase[R]||0)*(CTX.vpc||0))*boost);
    case'chgain':return Math.floor((st.chGainBase[R]||0)*boost);
    case'power':return e.P;
    default:return e.score;
  }
}

// ===== 探索（ランダム多点スタート＋局所探索） =====
// 探索の乱数は種を固定（同じ条件なら何度押しても同じ結果になるように）
let rnd=Math.random;
function seedRnd(a){rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function randomTeam(){
  const st=state.settings,t={m:[],s:[],L:0,lm:[],ls:[]};const usedC=new Set();
  const lockedM=M.map((m,i)=>m.lock?i:-1).filter(i=>i>=0).slice(0,5);
  for(const i of lockedM){t.m.push(i);t.lm.push(true);usedC.add(M[i].chara)}
  const pool=M.map((_,i)=>i).filter(i=>!lockedM.includes(i)).sort(()=>rnd()-.5);
  for(const i of pool){if(t.m.length>=5)break;if(st.uniqueChara&&usedC.has(M[i].chara))continue;t.m.push(i);t.lm.push(false);usedC.add(M[i].chara)}
  if(t.m.length<5)return null;
  const lockedS=S.map((s,i)=>s.lock?i:-1).filter(i=>i>=0).slice(0,5);
  const sp=S.map((_,i)=>i).filter(i=>!lockedS.includes(i)).sort(()=>rnd()-.5);
  t.s=[...lockedS,...sp].slice(0,5);
  t.ls=t.s.map(i=>!!S[i].lock);
  t.L=Math.floor(rnd()*5);
  return t;
}
function localSearch(t,f){
  const uc=state.settings.uniqueChara;let cur=f(ev(t));
  for(let guard=0;guard<200;guard++){
    let best=cur,mv=null;
    const inM=new Set(t.m),inS=new Set(t.s);
    for(let i=0;i<5;i++){if(t.lm[i])continue;const old=t.m[i];
      const chars=new Set(t.m.filter((_,k)=>k!==i).map(k=>M[k].chara));
      for(let j=0;j<M.length;j++){if(inM.has(j))continue;if(uc&&chars.has(M[j].chara))continue;
        t.m[i]=j;const v=f(ev(t));if(v>best){best=v;mv=['m',i,j]}}
      t.m[i]=old}
    for(let i=0;i<5;i++){if(t.ls[i])continue;const old=t.s[i];
      for(let j=0;j<S.length;j++){if(inS.has(j))continue;t.s[i]=j;const v=f(ev(t));if(v>best){best=v;mv=['s',i,j]}}
      t.s[i]=old}
    for(let i=0;i<5;i++)for(let k=i+1;k<5;k++){
      [t.s[i],t.s[k]]=[t.s[k],t.s[i]];const v=f(ev(t));if(v>best){best=v;mv=['w',i,k]}[t.s[i],t.s[k]]=[t.s[k],t.s[i]]}
    for(let i=0;i<5;i++){if(i===t.L)continue;const o=t.L;t.L=i;const v=f(ev(t));if(v>best){best=v;mv=['L',i]}t.L=o}
    if(!mv)break;
    if(mv[0]==='m')t.m[mv[1]]=mv[2];else if(mv[0]==='s')t.s[mv[1]]=mv[2];
    else if(mv[0]==='w'){const[i,k]=[mv[1],mv[2]];[t.s[i],t.s[k]]=[t.s[k],t.s[i]];[t.ls[i],t.ls[k]]=[t.ls[k],t.ls[i]]}
    else t.L=mv[1];
    cur=best;
  }
  return{t,val:cur};
}
// 仕上げ: スナップ2枚を同時に入れ替える手も試す（1枚ずつだとランクを割るので動けない局所解の対策）
function polish2(t,f){t=JSON.parse(JSON.stringify(t));let cur=f(ev(t));
  for(let guard=0;guard<10;guard++){let best=cur,mv=null;const inS=new Set(t.s);
    for(let i=0;i<5;i++)for(let k=i+1;k<5;k++){if(t.ls[i]||t.ls[k])continue;const oi=t.s[i],ok=t.s[k];
      for(let j=0;j<S.length;j++){if(inS.has(j))continue;t.s[i]=j;
        for(let l=0;l<S.length;l++){if(l===j||inS.has(l))continue;t.s[k]=l;const v=f(ev(t));if(v>best){best=v;mv=[i,j,k,l]}}
        t.s[k]=ok}
      t.s[i]=oi}
    if(!mv)break;t.s[mv[0]]=mv[1];t.s[mv[2]]=mv[3];t=localSearch(t,f).t;cur=f(ev(t))}
  return canon(t)}
function optimizeF(f){
  let best=null;const R=Math.max(1,state.settings.restarts|0);
  for(let r=0;r<R;r++){const t=randomTeam();if(!t)return null;const res=localSearch(t,f);if(!best||res.val>best.val)best={t:JSON.parse(JSON.stringify(res.t)),val:res.val}}
  return canon(best.t);
}
// 並び順だけ違う同じ編成が毎回違って見えないよう、リーダーを先頭・残りはメンバー一覧順に並べ替える
function canon(t){const idx=[0,1,2,3,4].sort((a,b)=>(b===t.L)-(a===t.L)||t.m[a]-t.m[b]);
  return{...t,m:idx.map(i=>t.m[i]),s:idx.map(i=>t.s[i]),lm:idx.map(i=>t.lm[i]),ls:idx.map(i=>t.ls[i]),L:0}}
function solve(song,obj){
  // 合計目的: 先にチャレンジ楽曲で最適なチャレンジ編成を求め、チャレンジpt 1あたりの価値を出す
  let chal=null;
  const chSong=state.ui.chSong==='none'?null:(state.songs.find(x=>x.id===state.ui.chSong)||song);
  if(obj==='chscore'){if(!chSong)return{error:'チャレンジ楽曲を選んでください。'};song=chSong}
  if((obj==='ptTotal'||obj==='itemTotal')&&chSong){const keep=state.settings.chMult;state.settings.chMult=1;
    const cr=solve(chSong,obj==='ptTotal'?'chpt':'chitem');state.settings.chMult=keep;
    if(cr.best){const e=ev({...cr.best.t,detail:true});
      chal={song:chSong.name,rank:RANKS[cr.best.rank],score:e.score,lo:e.lo,hi:e.hi,pt:e.pt,it:e.it,P:e.P,per1600:cr.best.val*8,vpc:cr.best.val/200,
        slots:e.slots.map((x,i)=>slotRow(x,i===cr.best.t.L))}}
  }
  if(obj==='gkscore'&&!song.gkTypes?.length)return{error:'この曲は撃奏ライブのデータ（撃奏区間の種類）がありません。'};
  prep(song,obj==='chpt'||obj==='chitem'||obj==='chscore',obj==='gkscore');CTX.vpc=chal?chal.vpc:0;
  if(M.length<5)return{error:'メンバーが5人未満です（除外中を含めて確認してください）。'};
  if(state.settings.uniqueChara&&new Set(M.map(m=>m.chara)).size<5)return{error:'キャラ重複不可の設定で、異なるキャラが5人そろいません。'};
  const pack=t=>{const e=ev({...t,detail:true});const rank=rankOf(e.lo,song);return{t,e,rank,val:value(obj,e,rank)}};
  if(obj==='score'||obj==='chscore'||obj==='gkscore'||obj==='power'){
    // 撃奏: 区間の種類が1種類の曲は、勝てる編成の条件（撃奏スキル持ちの人数・JUSTは区間全体の判定幅スナップ）を満たす中で最大を探す
    // 条件は実戦で全勝できた編成から（JUST: JUSTスキル4人＋判定幅2枚、COMBO: COMBOスキル4人、LUCK: LUCKスキル2人）
    let f=obj==='power'?e=>e.P:e=>e.score;
    if(obj==='gkscore'&&state.settings.gkReq!==false){const ty=new Set(song.gkTypes||[]);if(ty.size===1){const k=[...ty][0],st=state.settings;
      const need=({JUST:st.gkNeedJ??4,COMBO:st.gkNeedC??4,LUCK:st.gkNeedL??2})[k]||0,nj=k==='JUST'?(st.gkNeedJudge??2):0;
      f=e=>{const sh=Math.max(0,need-((e.mk||{})[k]||0))+Math.max(0,nj-(e.nj||0));return e.score*(sh?0.5-0.05*sh:1)}}}
    const t=optimizeF(f);return{best:pack(t),frontier:[],chal,songId:song.id};
  }
  const bonusKey=(obj==='pt'||obj==='chpt'||obj==='ptTotal')?'pt':'it';
  const frontier=[];
  // 目標ランクごとに「必要スコアを満たす中でボーナス最大」を探す
  for(let r=0;r<RANKS.length;r++){
    const th=r===0?0:song.thr?.[RANKS[r]];if(r>0&&!(th>0))continue;const need=th/lowF();
    // 主目的のボーナスが同じなら、もう一方のボーナス（pt↔アイテム）が高い編成を選ぶ
    const sub=bonusKey==='pt'?'it':'pt';
    const f0=e=>e.lo>=need?1e15+e[bonusKey]*1e6+e.lo*1e-3:e.lo;
    const f=e=>e.lo>=need?1e15+e[bonusKey]*1e6+e[sub]*1e2+e.lo*1e-5:e.lo;
    // 副目的を入れると局所解に落ちやすいので、主目的だけの探索結果も候補にして良い方を採る
    // f0の結果からfで仕上げ探索もして、3つのうち最良を採る
    const t1=optimizeF(f0),t2=optimizeF(f),t3=canon(localSearch(JSON.parse(JSON.stringify(t1)),f).t);
    const t=polish2([t1,t2,t3].reduce((a,b)=>f(ev(b))>f(ev(a))?b:a),f);const p=pack(t);
    if(p.e.lo>=need)frontier.push({...p,target:r,need});
  }
  // 同じ編成の重複を除く
  const seen=new Set();const fr=frontier.filter(p=>{const k=Math.round(p.e.score)+'|'+p.e.pt+'|'+p.e.it;if(seen.has(k))return false;seen.add(k);return true});
  fr.sort((a,b)=>b.target-a.target);
  // 価値が同じなら、もう一方のボーナス→スコアの高い方（同点の選び方で毎回結果が変わらないように）
  const sub=bonusKey==='pt'?'it':'pt';
  const best=fr.reduce((a,b)=>!a||b.val>a.val||(b.val===a.val&&(b.e[sub]>a.e[sub]||(b.e[sub]===a.e[sub]&&b.e.score>a.e.score)))?b:a,null);
  return{best,frontier:fr,bonusKey,chal,songId:song.id};
}

let lastResult=null,shownIdx=null;
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([id,l])=>`<button role="tab" aria-selected="${state.ui.tab===id}" data-tab="${id}">${l}</button>`).join('');
}
// 編成表（レア・キャラ・バンド・カード名・タイプ・スナップ）
function teamTable(rows){return`<div class="tbl"><table class="team"><thead><tr><th></th><th>レア</th><th>キャラ</th><th>バンド</th><th>カード名</th><th>タイプ</th><th>スナップ</th></tr></thead><tbody>${rows.map(r=>`<tr${r.lead?' class="best"':''}><td>${r.lead?'<b style="color:var(--accent)">★</b>':''}</td><td>${esc(r.rarity)}</td><td><b>${esc(r.chara)}</b></td><td>${esc(r.band)}</td><td>${esc(r.name)}</td><td>${chip(r.type)}</td><td>${r.snap?`${chip(r.snapType)} ${esc(r.snap)}`:'<span class="muted">なし</span>'}</td></tr>`).join('')}</tbody></table></div><p class="note">★＝リーダー</p>`}
const slotRow=(x,lead)=>({lead,rarity:x.m.rarity,chara:x.m.chara,band:x.m.band,name:x.m.name,type:x.m.type,snap:x.s.none?'':x.s.name,snapType:x.s.type});
function chip(t){return t?`<span class="chip t-${esc(t)}">${esc(t)}</span>`:''}
function opts(list,val,blank){return(blank!==undefined?`<option value="">${blank}</option>`:'')+list.map(x=>{const[v,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`}).join('')}
function charaOpts(val,blank){return(blank!==undefined?`<option value="">${blank}</option>`:'')+BAND_NAMES.map(b=>`<optgroup label="${esc(b)}">${BANDS[b].map(c=>`<option${c===val?' selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}
const LEADER_STATS=[['all','全パラ'],['P','Pfm'],['T','Tec'],['V','Vis']];
const LIVE_KINDS=['シンプル','判定','ライフ'],GEKI_KINDS=['JUST','COMBO','LUCK'];
const LEADER_CONDS=[['','—'],['all','全員'],...TYPES.map(t=>['type:'+t,t+'のみ']),...BAND_NAMES.map(b=>['band:'+b,b+'のみ']),...LIVE_KINDS.map(k=>['skill:'+k,'スキル【'+k+'】']),...GEKI_KINDS.map(k=>['geki:'+k,'撃奏【'+k+'】'])];
function sampleBanner(){return''}
function curSong(){return state.songs.find(s=>s.id===state.ui.song)||state.songs[0]}

function guidePanel(){
  const nm=state.members.length,ns=state.snaps.length,set=Object.values(state.settings.charaRankLv||{}).some(v=>v>1)||state.settings.vip>0;
  const st=(ok,t)=>`<li class="${ok?'done':''}">${ok?'✓ ':''}${t}</li>`;
  const open=state.ui.guide!==false||!nm;
  return`<details class="panel guide" data-guide${open?' open':''}><summary><b>使い方</b>${nm?`<span class="muted">（メンバー${nm}枚・スナップ${ns}枚を登録済み）</span>`:''}</summary>
    <ol class="steps">
      ${st(nm>=5&&ns>=5,`<b>手持ちを登録する</b>：「メンバー」「スナップ」タブで、持っているカードの「所持」にチェックを入れ、Lv・特訓・覚醒などをゲームの詳細画面に合わせます。数値は自動で計算されます。`)}
      ${st(set,PUBLIC?`<b>プレイヤー情報を入れる</b>（任意）：「データ」タブから、キャラクターランク・バンドアイテム・T.G.W CARD の値を書いたJSONを読み込むと総合力が正確になります。`:`<b>プレイヤー情報を入れる</b>（任意）：「設定・データ」タブで、キャラクターランク・バンドアイテム・T.G.W CARD の値を入れると総合力が正確になります。`)}
      ${st(false,`<b>目的と曲を選んで計算する</b>：この画面で目的（スコア最大・イベントpt最大など）と曲を選び、「最適編成を計算」を押します。`)}
    </ol>
    <div class="row">${nm?'':`<button class="btn small primary" data-act="goMembers">メンバーを登録する</button>`}${PUBLIC?'':'<button class="btn small" data-act="useAuthor">作者の手持ちで試す</button>'}</div>
    <p class="note">非公式のファンツールです。予想スコアの誤差の目安は、フリー・チャレンジで±3%、撃奏で±8%程度です。ランクぎりぎりの編成は、「予想スコアの幅」を3%程度にして選ぶのがおすすめです。</p>
  </details>`}
function viewOpt(){
  const song=curSong(),o=state.ui.obj;
  // 目的ごとに関係する入力だけを強調する（チャレンジ楽曲: 合計とチャレンジスコア、消費倍率: 合計のみ）
  const useCh=o==='ptTotal'||o==='itemTotal'||o==='chscore',useMult=o==='ptTotal'||o==='itemTotal';
  return`<div class="stack">${guidePanel()}
  <section class="panel stack">
    <div class="row">
      <label class="f">目的<select id="obj">${opts(OBJECTIVES.map(o=>[o.id,o.label]),state.ui.obj)}</select></label>
      <label class="f">楽曲（入力で検索・空欄で一覧）${comboHtml('songSel',song?.name||'')}</label>
      <label class="f${useCh?'':' dim'}" title="${useCh?'':'この目的では使いません'}">チャレンジ楽曲${useCh?'':'（この目的では不使用）'}${comboHtml('chSongSel',state.ui.chSong==='none'?NO_CH:((state.songs.find(x=>x.id===state.ui.chSong)||song)?.name||''))}</label>
      <label class="f">ライブブースト<select id="lb">${opts([0,1,2,3,4,5,10].map(n=>[n,n===0?'なし（×1）':`${n}個（×${n*5}）`]),state.settings.lb)}</select></label>
      <label class="f${useMult?'':' dim'}" title="${useMult?'':'この目的では使いません'}">チャレンジ消費倍率${useMult?'':'（この目的では不使用）'}<select id="chMult">${opts([1,2,4,8].map(n=>[n,`${n}倍（${n*200}消費）`]),state.settings.chMult)}</select></label>
      <label class="f">予想スコアの幅 ±%<input type="number" id="margin" value="${state.settings.margin}" step="0.5" min="0"></label>
      <button class="btn primary" id="run">最適編成を計算</button>
    </div>
  </section>
  <section id="result">${lastResult?renderResult():'<div class="panel muted">「最適編成を計算」を押すと結果がここに出ます。</div>'}</section>
  </div>`;
}
function renderResult(){
  const R=lastResult,song=state.songs.find(x=>x.id===R.songId)||curSong();
  if(R.error)return`<div class="panel bad">${esc(R.error)}</div>`;
  if(!R.best)return`<div class="panel warn">どのランクの必要スコアにも届く編成がありません。楽曲タブで閾値とスコア係数Kを確認してください。</div>`;
  const P=shownIdx!=null?R.frontier[shownIdx]:R.best;
  const e=ev({...P.t,detail:true});const objLabel=OBJECTIVES.find(o=>o.id===R.obj).label;
  const st=state.settings;
  const vals=['pt','item','chpt','chitem','chgain'].map(o=>value(o,e,P.rank));
  const slots=teamTable(e.slots.map((x,i)=>slotRow(x,i===P.t.L)));
  const fr=R.frontier.length?`<h3>到達ランク別の候補</h3><div class="tbl"><table><thead><tr><th>確実ランク</th><th class="num">予想の中央に必要</th><th class="num">予想スコアの幅</th><th class="num">ptボーナス</th><th class="num">アイテムボーナス</th><th class="num">${esc(objLabel.replace(/最大.*$/,''))}/回</th><th></th></tr></thead><tbody>
    ${R.frontier.map((p,i)=>`<tr class="${p===R.best?'best':''}"><td><b>${RANKS[p.rank]}</b></td><td class="num">${fmt((song.thr?.[RANKS[p.rank]]||0)/lowF())}</td><td class="num">${fmt(p.e.lo*lowF())} 〜 ${fmt(p.e.hi*highF())}</td><td class="num">+${p.e.pt}%</td><td class="num">+${p.e.it}%</td><td class="num"><b>${fmt(p.val)}</b></td><td><button class="btn small" data-show="${i}">${(shownIdx===i||(shownIdx==null&&p===R.best))?'表示中':'表示'}</button>${p===R.best?' <span class="pill">最適</span>':''}</td></tr>`).join('')}
    </tbody></table></div>`:'';
  const nextThr=RANKS.slice(P.rank+1).map(r=>song.thr?.[r]).find(x=>x>0);
  const C=R.chal;let chalHtml='';
  if(C){const isPt=R.obj==='ptTotal',boost=st.lb>0?st.lb*5:1,Rk=RANKS[P.rank];
    const direct=Math.floor(((isPt?st.ptBase[Rk]:st.itemBase[Rk])||0)*(1+(isPt?e.pt:e.it)/100)*boost),cp=Math.floor((st.chGainBase[Rk]||0)*boost);
    chalHtml=`<div class="panel stack"><h2>チャレンジ — ${esc(C.song)}</h2>
    <p class="note">フリーライブ1回（LB${st.lb}）で：直接 ${fmt(direct)} ＋ チャレンジpt ${cp} → チャレンジライブ換算 ${fmt(cp*C.vpc)}（合計 ${fmt(direct+cp*C.vpc)}）。チャレンジpt 1あたり ${C.vpc.toFixed(1)}${isPt?'pt':'個'}。チャレンジライブではイベント対象カードの総合力がボーナス分上がります（パラメータボーナス）。</p>
    <details class="kpibox" data-kpi${state.ui.kpiOpen===false?'':' open'}><summary>スコア・ボーナス</summary><div class="kpis"><div class="kpi"><div class="k">確実ランク</div><div class="v r">${C.rank}</div></div>
      <div class="kpi"><div class="k">総合力</div><div class="v">${fmt(C.P)}</div></div>
      <div class="kpi"><div class="k">予想スコア（幅）</div><div class="v">${fmt(C.score)}</div>${C.lo?`<div class="mono muted" style="font-size:12px">${fmt(C.lo*lowF())} 〜 ${fmt(C.hi*highF())}</div>`:''}</div>
      <div class="kpi"><div class="k">ボーナス pt / アイテム</div><div class="v">+${C.pt}% / +${C.it}%</div></div>
      <div class="kpi"><div class="k">1600消費（8倍）1回</div><div class="v">${fmt(C.per1600)}</div></div></div></details>
    ${teamTable(C.slots)}</div>`}
  return`<div class="stack"><div class="panel stack">
    <h2>${R.chal?'フリー':esc(objLabel)}${shownIdx!=null&&R.frontier[shownIdx]!==R.best?'（比較表示）':''} — ${esc(song.name)}</h2>
    <details class="kpibox" data-kpi${state.ui.kpiOpen===false?'':' open'}><summary>スコア・ボーナス</summary><div class="kpis">
      <div class="kpi"><div class="k">確実ランク（幅の下限）</div><div class="v r">${RANKS[P.rank]}</div></div>
      <div class="kpi"><div class="k">予想スコア（幅）</div><div class="v">${fmt(e.score)}</div><div class="mono muted" style="font-size:12px">${fmt(e.lo*lowF())} 〜 ${fmt(e.hi*highF())}</div></div>
      <div class="kpi"><div class="k">総合力（推定）</div><div class="v">${fmt(e.P)}</div></div>
      <div class="kpi"><div class="k">ptボーナス</div><div class="v">+${e.pt}%</div></div>
      <div class="kpi"><div class="k">アイテムボーナス</div><div class="v">+${e.it}%</div></div>
      <div class="kpi"><div class="k">pt / 回（LB${st.lb}）</div><div class="v">${fmt(vals[0])}</div></div>
      <div class="kpi"><div class="k">アイテム / 回</div><div class="v">${fmt(vals[1])}</div></div>
      <div class="kpi"><div class="k">獲得チャレンジpt / 回</div><div class="v">${fmt(vals[4])}</div></div>
      ${R.chal?(()=>{const C=R.chal,m=st.chMult,cp=vals[4];const cpt=Math.floor((st.chPtBase[C.rank]||0)*m*(1+C.pt/100)),cit=Math.floor((st.chItemBase[C.rank]||0)*m*(1+C.it/100)),sh=cp/(200*m);
        return`<div class="kpi"><div class="k">チャレンジ編成 ${m}倍1回 pt / アイテム</div><div class="v">${fmt(cpt)} / ${fmt(cit)}</div></div>
        <div class="kpi" style="border-color:var(--accent)"><div class="k">フリー1回あたり合計（チャレンジ換算込み）pt / アイテム</div><div class="v">${fmt(vals[0]+cpt*sh)} / ${fmt(vals[1]+cit*sh)}</div></div>`})()
      :`<div class="kpi"><div class="k">この編成でチャレンジ ${st.chMult}倍 pt / アイテム</div><div class="v">${fmt(vals[2])} / ${fmt(vals[3])}</div></div>`}
    </div>
    <p class="note">スキル寄与 +${(e.Sk*100).toFixed(1)}%。${(()=>{const up=rankRaw(e.hi*highF(),song),mid=rankRaw(e.score,song);return up>P.rank?`上振れすれば ${RANKS[up]}${mid>P.rank?`（予想どおりなら ${RANKS[mid]}）`:''} に届きます。`:''})()}${nextThr?`確実に次のランクに届くには、予想スコアをあと約 ${fmt(nextThr/lowF()-e.score)} 上げる必要があります。`:''}</p>${R.obj==='gkscore'?`<p class="note">予想 1位 ${fmt(e.score)}／全区間2位 ${fmt(e.gkLose)}</p>`:''}</details>
    ${R.obj==='gkscore'?`<p class="note"><b>撃奏区間：${(song.gkTypes||[]).join(' / ')}</b></p>`:''}
    ${slots}
    ${PUBLIC?'':`<details><summary>実プレイのスコアで係数Kを校正する</summary>
      <div class="row" style="margin-top:8px"><label class="f">この編成で出た実スコア<input type="number" id="calScore" style="width:130px" placeholder="例 3710000"></label><button class="btn small" data-act="calibrate">Kを更新</button><span class="note">今のK = ${song.K}。実スコア ÷ (総合力 × (1+スキル寄与)) を新しいKにします。</span></div>
    </details>`}
  </div>${chalHtml}${fr}</div>`;
}

// ===== メンバー・スナップ（全カード。所持にチェックしたものだけ編成に使う） =====
const n5=[1,2,3,4,5];
function cardFilter(){const f=state.ui.cf||{own:'own',band:''};state.ui.cf=f;return f}
function filterBar(kind){const f=cardFilter();const own=Object.values(state.roster[kind]).filter(r=>r.own).length;
  return`<div class="row"><label class="f">表示<select data-cf="own">${opts([['own','所持のみ'],['all','全カード'],['not','未所持のみ']],f.own)}</select></label>
    <label class="f">バンド<select data-cf="band">${opts(BAND_NAMES,f.band,'すべて')}</select></label>
    <span class="muted">所持 ${own}枚 / 全 ${kind==='m'?CAT.members.length:CAT.snaps.length}枚</span>
    <span style="flex:1"></span><button class="btn small" data-act="importFile">JSONを読み込む</button><button class="btn small" data-act="exportFile">ファイルに書き出す</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p id="jsonMsg" class="note" style="margin:0"></p>${jsonHelp(false)}`}
function pass(r,band){const f=cardFilter();const own=!!(r&&r.own);if(f.own==='own'&&!own)return false;if(f.own==='not'&&own)return false;if(f.band&&band!==f.band)return false;return true}
const fmtLead=L=>L.map(([c,st,p])=>`${c==='all'?'全員':c.replace(/^(band|type|chara|skill|geki|bandtype):/,'').replace(':','・')} ${({all:'全',P:'P',T:'T',V:'V'})[st]}+${p}%`).join('／')||'—';
function emptyNote(kind){return Object.values(state.roster[kind]).some(r=>r.own)?'':`<div class="banner"><b>まだ所持カードがありません。</b><span class="muted">「表示」を「全カード」にして、持っているカードの「所持」にチェックを入れてください。</span><button class="btn small" data-act="showAll">全カードを表示</button></div>`}
function viewMembers(){
  const rows=[...CAT.members].sort((a,b)=>BAND_NAMES.indexOf(a.band)-BAND_NAMES.indexOf(b.band)||CHARAS.indexOf(a.chara)-CHARAS.indexOf(b.chara)||b.id-a.id).filter(c=>pass(state.roster.m[c.id],c.band)).map(c=>{
    const r0=state.roster.m[c.id],r=r0||{...newMR(c),own:0},own=!!r.own,[P,T,V]=mStats(c,r);const e=evBonus({name:c.title,chara:c.chara,band:c.band,type:c.type,awak:r.rk-1},'member');
    return`<tr data-kind="cm" data-id="${c.id}" class="${own?'':'dim'}">
    <td><input data-f="own" type="checkbox"${own?' checked':''}></td>
    <td><input data-f="lock" type="checkbox"${r.lock?' checked':''}${own?'':' disabled'} title="必ず入れる"></td>
    <td><input data-f="excl" type="checkbox"${r.excl?' checked':''}${own?'':' disabled'} title="使わない"></td>
    <td>${esc(c.chara)}</td><td>${esc(c.title)}</td><td>${c.rarity}</td><td>${chip(c.type)}</td>
    <td style="white-space:nowrap"><input data-f="lv" type="number" min="1" max="${c.lim[r.tr-1]}" value="${r.lv}" style="width:58px"><span class="muted">/${c.lim[r.tr-1]}</span></td>
    <td><select data-f="tr">${opts(n5,r.tr)}</select></td><td><select data-f="rk">${opts(n5,r.rk)}</select></td>
    <td><select data-f="sl">${opts(n5,r.sl)}</select></td><td><select data-f="gl">${opts(n5,r.gl)}</select></td>
    <td class="num">${fmt(P+T+V)}<div class="muted mono" style="font-size:11px">${P}/${T}/${V}</div></td>
    <td style="font-size:12px">${esc(fmtLead(c.leader[r.rk-1]))}</td>
    <td style="font-size:12px;white-space:nowrap">${c.liveKind} ${c.live[r.sl-1]}%</td><td>${c.geki}</td>
    <td class="num" style="font-size:12px">${e.pt||e.param?`pt+${e.pt}% / パラ+${e.param}%`:'—'}</td></tr>`}).join('');
  return`<div class="stack"><section class="panel stack">
    <h2 style="margin:0">メンバー</h2>
    <p class="note">ゲームの全カードが並んでいます。持っているカードの「所持」にチェックを入れ、メンバー詳細の <b>Lv・特訓・覚醒・ライブスキルLv・撃奏スキルLv</b> を合わせてください。総合力やスキルの値は自動で計算されます。未所持のカードは編成に入りません（値は覚えておけます）。</p>
    ${filterBar('m')}</section>${emptyNote('m')}
  <div class="tbl"><table><thead><tr><th>所持</th><th>固定</th><th>除外</th><th>キャラ</th><th>カード名</th><th>レア</th><th>タイプ</th><th>Lv</th><th>特訓</th><th>覚醒</th><th>スキルLv</th><th>撃奏Lv</th><th class="num">総合力</th><th>リーダースキル</th><th>ライブスキル</th><th>撃奏</th><th>イベント補正</th></tr></thead>
  <tbody>${rows}</tbody></table></div></div>`;
}
function viewSnaps(){
  const rows=[...CAT.snaps].sort((a,b)=>BAND_NAMES.indexOf(a.band)-BAND_NAMES.indexOf(b.band)||b.id-a.id).filter(c=>pass(state.roster.s[c.id],c.band)).map(c=>{
    const r0=state.roster.s[c.id],r=r0||{...newSR(c),own:0},own=!!r.own,[cP,cT,cV]=sStats(c,r),sk=c.rk[r.rk-1],ex=c.ext[sk[1]-1]||[0,0],g=c.gk[sk[2]-1]||[0,0];
    const e=evBonus({name:c.title,chara:c.chara,band:c.band,type:c.type,lb:r.rk-1},'snap');
    return`<tr data-kind="cs" data-id="${c.id}" class="${own?'':'dim'}">
    <td><input data-f="own" type="checkbox"${own?' checked':''}></td>
    <td><input data-f="lock" type="checkbox"${r.lock?' checked':''}${own?'':' disabled'}></td>
    <td><input data-f="excl" type="checkbox"${r.excl?' checked':''}${own?'':' disabled'}></td>
    <td>${esc(c.title)}</td><td>${c.rarity}</td><td>${chip(c.type)}</td><td style="font-size:12px">${esc(c.band||'—')}</td><td>${esc(c.chara||'—')}</td>
    <td style="white-space:nowrap"><input data-f="lv" type="number" min="1" max="${sk[0]}" value="${r.lv}" style="width:58px"><span class="muted">/${sk[0]}</span></td>
    <td><select data-f="rk">${opts(n5,r.rk)}</select></td>
    <td class="mono" style="font-size:12px;white-space:nowrap">${cP}/${cT}/${cV}%</td>
    <td style="font-size:12px">${ex[0]?`${ex[0]}秒（一致${ex[1]}秒）`:'—'}</td>
    <td style="font-size:12px">${c.gkType||'—'} ${g[0]?`${g[0]}%（一致${g[1]}%）`:''}${c.gkJudgeAll?' 判定幅':''}</td>
    <td class="num" style="font-size:12px">${e.item||e.param?`アイテム+${e.item}% / パラ+${e.param}%`:'—'}</td></tr>`}).join('');
  return`<div class="stack"><section class="panel stack">
    <h2 style="margin:0">スナップ</h2>

    <ul class="note" style="margin:0;padding-left:18px">
      <li>枠の総合力＝個人総合力×(1+メンバーのイベントパラ%)×(1＋スナップ補正%＋スナップのイベントパラ%＋バンドアイテム%＋タイプリンク%（スナップ覚醒×5%）＋タイプボーナス%（曲タイプ一致・メンバー覚醒×5%）＋得意楽曲%（持ち歌バンド・メンバー覚醒×5%）＋T.G.W CARD%＋リーダースキル%×対象パラメータの比率)。ゲームの「総合力詳細」の内訳（メンバー＋リーダースキル＋スナップ＋バンドアイテム＋キャラランク＋タイプリンク＋T.G.W CARD）と同じ足し算の形です。キャラランクの固定加算（5人で数千程度）は省略しています。</li>
      <li>予想スコア（フリー・チャレンジ）＝総合力×(base＋x̄×W)×全体補正。bdon.moe のモデルで、base は曲ごとのスキルなし全PERFECTのスコア÷総合力、W はスキル発動枠5つの重みの合計、x̄ は5人の「スキル%×(5秒＋延長秒)/5秒」の平均。スキルは1曲5回、メンバー順はライブごとにランダム（120通り）なので、順番による±のばらつきも計算し、悪い順番（既定1.28σ＝下位約10%）でも届くランクで判定します。全体補正1.005は実測6回の平均。撃奏ライブと、bdon.moe にデータの無い曲は従来の K×総合力×(1＋実効係数×Σスキル%×秒/曲長) です。</li>
      <li>ランクは閾値×(1＋安全マージン)で判定。pt・アイテムは同一ランク内ならスコアで増えないので、ランクを保ったままボーナスを最大化します。</li>
      <li>出典：<a href="https://github.com/empty-sekai/ournotes-deck" target="_blank" rel="noopener">empty-sekai/ournotes-deck</a>（クライアント準拠の計算式）、<a href="https://minemineaoao.hippy.jp/ourno/eventguide.html" target="_blank" rel="noopener">minemineaoao氏 イベント攻略（基礎値・ボーナス表）</a>、<a href="https://appmedia.jp/bang-dream-on/80441902" target="_blank" rel="noopener">AppMedia イベント解説</a>、<a href="https://gamerch.com/bang-dream-on/1017723" target="_blank" rel="noopener">Gamerch</a>、<a href="https://bdon.moe/en/tools/deck" target="_blank" rel="noopener">bdon.moe Deck builder</a>。</li>
    </ul>
  </section></div>`;
}

function render(){
  renderTabs();
  const v={opt:viewOpt,members:viewMembers,snaps:viewSnaps,songs:viewSongs,event:viewEvent,settings:viewSettings}[state.ui.tab]||viewOpt;
  document.getElementById('view').innerHTML=v();
}

// JSON取り込み: 全体のバックアップ（songs と roster を含む）なら置き換え、それ以外は書いてある項目だけ上書き
function importData(o){
  if(!o||typeof o!=='object')throw 0;
  if(o.roster&&o.songs){state=o;normalize();return'すべてのデータを読み込みました。'}
  if(!o.roster&&!o.settings&&!Array.isArray(o.members))throw 0;
  if(Array.isArray(o.members)&&!o.roster){state=o;normalize();return'読み込みました。'}
  let n=0;
  const byName={m:Object.fromEntries(CAT.members.map(c=>[c.title,c])),s:Object.fromEntries(CAT.snaps.map(c=>[c.title,c]))};
  for(const k of ['m','s'])for(const [key,r] of Object.entries(o.roster?.[k]||{})){const c=(k==='m'?CM:CSN)[key]||byName[k][key];if(!c)continue;const id=c.id;
    const cur=state.roster[k][id]||(k==='m'?newMR(c):newSR(c));for(const f of (k==='m'?['own','lv','tr','rk','sl','gl','lock','excl']:['own','lv','rk','lock','excl']))if(r[f]!=null)cur[f]=+r[f];
    clampR(k,c,cur);cur.ed=1;state.roster[k][id]=cur;n++}
  const st=o.settings||{};
  if(st.charaRankLv)for(const[c,v]of Object.entries(st.charaRankLv))if(CHARAS.includes(c))state.settings.charaRankLv[c]=+v;
  if(st.bandItem)for(const[b,v]of Object.entries(st.bandItem))if(BAND_NAMES.includes(b))state.settings.bandItem[b]=+v;
  if(st.vip!=null)state.settings.vip=+st.vip;
  materialize();return`読み込みました（カード${n}枚${o.settings?'・プレイヤー情報':''}）。`}
// ===== 操作 =====
const listOf=k=>k==='rules'?state.event.rules:state[k];
function setPath(o,path,val){const ps=path.split('.');let x=o;for(let i=0;i<ps.length-1;i++){x[ps[i]]??={};x=x[ps[i]]}x[ps.at(-1)]=val}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){state.ui.tab=tb.dataset.tab;save();render();return}
  const sh=e.target.closest('[data-show]');if(sh){const i=+sh.dataset.show;shownIdx=lastResult.frontier[i]===lastResult.best?null:i;document.getElementById('result').innerHTML=renderResult();return}
  const del=e.target.closest('[data-del]');if(del){const tr=del.closest('tr');const L=listOf(tr.dataset.kind);const i=L.findIndex(x=>x.id===tr.dataset.id);if(i>=0)L.splice(i,1);lastResult=null;save();render();return}
  if(e.target.id==='run'){runOpt();return}
  const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;
  const msg=t=>{const m=document.getElementById('jsonMsg');if(m)m.textContent=t};
  switch(a){
    case'useAuthor':if(Object.values(state.roster.m).some(r=>r.own)&&state.rosterSrc!=='author'&&!confirm('今の手持ちの登録を、作者の手持ちに置き換えますか？（先に「ファイルに書き出す」で控えを取れます）'))return;useAuthor();lastResult=null;break;
    case'clearRoster':if(!confirm('手持ちの登録をすべて消しますか？'))return;state.roster={m:{},s:{}};state.rosterSrc='';materialize();lastResult=null;break;
    case'goMembers':state.ui.tab='members';break;
    case'showAll':cardFilter().own='all';break;
    case'exportFile':{const name='ournotes-deck-'+new Date().toISOString().slice(0,10)+'.json',data=JSON.stringify(exportData(),null,1);
      (window.claude?.use?window.claude.use('downloads'):Promise.resolve(null)).then(dl=>{if(!dl){document.getElementById('json').value=data;msg('この表示ではファイル保存が使えません。下の欄のJSONをコピーして保存してください。');return}
        dl.save({filename:name,data}).then(()=>msg('書き出しました。'),e=>msg(e&&e.code==='declined'?'保存を取りやめました。':'書き出せませんでした。下の「JSONを表示」から控えを取ってください。'))});return}
    case'importFile':document.getElementById('importFile')?.click();return;

    case'addMember':state.members.push(M_('', '燈','SSR','紺碧',0,0,[],100,5));state.sample=false;break;
    case'addSnap':state.snaps.push(S_('','SR','紅赤','',20,0,2));state.sample=false;break;
    case'addSong':{const s={id:uid(),name:'新しい曲',type:'all',len:120,K:4.5,thr:{}};state.songs.push(s);break}
    case'loadEvent':{const id=document.getElementById('evPreset').value;state.event=myEvent(id);pickChSong(state.event);lastResult=null;break}
    case'addRule':state.event.rules.push({id:uid(),label:'',card:'',chara:'',band:'',type:'',target:'both',bonus:'',param:''});break;
    case'resetSettings':{const k=state.settings;state.settings={...defaultSettings(),charaRankLv:k.charaRankLv,bandItem:k.bandItem,vip:k.vip};break}
    case'loadSample':useAuthor();lastResult=null;break;
    case'exportJson':document.getElementById('json').value=JSON.stringify(state,null,1);msg('現在のデータを表示しました。');return;
    case'copyJson':{const ta=document.getElementById('json');if(!ta.value)ta.value=JSON.stringify(state,null,1);
      navigator.clipboard?.writeText(ta.value).then(()=>msg('コピーしました。'),()=>{ta.select();msg('自動コピーできないため選択しました。Ctrl+Cでコピーしてください。')});return}
    case'importJson':try{const o=JSON.parse(document.getElementById('json').value);if(!o.roster&&!Array.isArray(o.members))throw 0;state=o;normalize();lastResult=null;save();render();msg('読み込みました。')}catch(_){msg('JSONとして読めませんでした。「JSONを表示」で出した形式のまま貼り付けてください。')}return;
    case'calibrate':{const v=+document.getElementById('calScore').value;if(!(v>0))return;const song=state.songs.find(x=>x.id===lastResult.songId)||curSong();const P=shownIdx!=null?lastResult.frontier[shownIdx]:lastResult.best;
      prep(song,lastResult.obj==='chscore');const e=ev(P.t);if(CTX.sw)song.kf=+(v/(e.free/CTX.kf)).toFixed(4);else song.K=+(v/(e.P*(1+e.Sk))).toFixed(4);save();runOpt();return}
  }
  save();render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='obj'){state.ui.obj=el.value;save();render();return}
  if(el.id==='songSel'||el.id==='chSongSel')return;
  if(el.id==='lb'){state.settings.lb=+el.value;save();if(lastResult&&!lastResult.error)document.getElementById('result').innerHTML=renderResult();return}
  if(el.id==='chMult'){state.settings.chMult=+el.value;save();if(lastResult&&!lastResult.error)document.getElementById('result').innerHTML=renderResult();return}
  if(el.id==='margin'){state.settings.margin=+el.value||0;save();return}
  if(el.id==='evName'){state.event.name=el.value;save();return}
  if(el.dataset.set){const k=el.dataset.set;const v=el.type==='checkbox'?el.checked:+el.value;setPath(state.settings,k,v);lastResult=null;save();if(state.ui.tab==='members')render();return}
  if(el.dataset.cf){cardFilter()[el.dataset.cf]=el.value;save();render();return}
  if(el.id==='importFile'){const fl=el.files&&el.files[0];if(!fl)return;fl.text().then(t=>{try{const m=importData(JSON.parse(t));lastResult=null;save();render();alert(m)}catch(_){alert('このファイルは読み込めませんでした。')}});el.value='';return}
  const ctr=el.closest('tr[data-kind="cm"],tr[data-kind="cs"]');
  if(ctr&&el.dataset.f){const k=ctr.dataset.kind==='cm'?'m':'s',id=ctr.dataset.id,c=(k==='m'?CM:CSN)[id],f=el.dataset.f;
    let r=state.roster[k][id];if(!r){r=state.roster[k][id]=k==='m'?newMR(c):newSR(c);r.own=0}
    const old=r[f];if(f==='own'||f==='lock'||f==='excl')r[f]=el.checked?1:0;else r[f]=+el.value;
    // 特訓・上限解放を変えたとき、Lvが前の上限ちょうどなら新しい上限に合わせる
    if(f==='tr'&&k==='m'&&r.lv===c.lim[old-1])r.lv=c.lim[r.tr-1];
    if(f==='rk'&&k==='s'&&r.lv===c.rk[old-1][0])r.lv=c.rk[r.rk-1][0];
    clampR(k,c,r);r.ed=1;materialize();lastResult=null;save();render();return}
  const tr=el.closest('tr[data-kind]');if(!tr||!el.dataset.f)return;
  const item=listOf(tr.dataset.kind).find(x=>x.id===tr.dataset.id);if(!item)return;
  const f=el.dataset.f;let v=el.type==='checkbox'?el.checked:(el.dataset.n!==undefined?(el.value===''?'':+el.value):el.value);
  if(/^l[cps][01]$/.test(f)){const i=+f[2];item.leader||=[];item.leader[i]||={cond:'',pct:0,stat:'all'};const l=item.leader[i];
    if(f[1]==='c')l.cond=v;else if(f[1]==='s')l.stat=v;else l.pct=v===''?0:v}
  else if(/^p[PTV]$/.test(f)){item[f]=v;if(item.pP>0&&item.pT>0&&item.pV>0){item.power=item.pP+item.pT+item.pV;state.sample=false;lastResult=null;save();render();return}}
  else if(f.startsWith('thr.')){item.thr||={};item.thr[f.slice(4)]=v===''?0:v}
  else item[f]=v;
  state.sample=false;lastResult=null;save();
  if(['chara','type','awak','lb','name','band','target','card','bonus','param'].includes(f))render();
});
document.addEventListener('toggle',ev=>{const g=ev.target;if(g.matches&&g.matches('details[data-guide]')){state.ui.guide=g.open;save();return}},true);
document.addEventListener('toggle',ev=>{const d=ev.target;if(!d.matches||!d.matches('details[data-kpi]'))return;state.ui.kpiOpen=d.open;document.querySelectorAll('details[data-kpi]').forEach(x=>{if(x!==d&&x.open!==d.open)x.open=d.open});save()},true);
function runOpt(){
  const btn=document.getElementById('run');if(btn){btn.disabled=true;btn.textContent='計算中…'}
  setTimeout(()=>{
    const song=curSong();
    if(!song){lastResult={error:'楽曲タブで曲を登録してください。'}}
    else{seedRnd(12345);const r=solve(song,state.ui.obj);lastResult={...r,obj:state.ui.obj}}
    shownIdx=null;save();render();
  },30);
}

// ===== 楽曲のコンボボックス（入力すれば検索、空欄なら全曲の一覧） =====
const NO_CH='なし（チャレンジライブ無し）';
function comboHtml(id,val){return`<span class="combo"><input id="${id}" class="songpick" value="${esc(val)}" data-prev="${esc(val)}" autocomplete="off" role="combobox" aria-expanded="false" placeholder="曲名を入力（空欄で一覧）"><button type="button" class="combo-btn" data-combo-btn="${id}" tabindex="-1" aria-label="一覧を開く">▾</button><span class="combo-list" role="listbox" hidden></span></span>`}
function comboItems(id){
  const nz=x=>x.normalize('NFKC').toLowerCase();
  const songs=state.songs.map(x=>({v:x.id,l:x.name}));
  if(id!=='chSongSel')return songs;
  const ch=(state.event.chSongs||[]).map(n=>state.songs.find(x=>x.name.startsWith(n))).filter(Boolean).map(x=>({v:x.id,l:x.name,tag:'課題楽曲'}));
  const chIds=new Set(ch.map(x=>x.v));
  return[{v:'none',l:NO_CH},...ch,...songs.filter(x=>!chIds.has(x.v))];
}
function comboOpen(inp,q){
  const list=inp.parentNode.querySelector('.combo-list');const nz=x=>x.normalize('NFKC').toLowerCase();const qq=nz(q||'');
  const items=comboItems(inp.id).filter(x=>!qq||nz(x.l).includes(qq));
  list.innerHTML=items.length?items.map((x,k)=>`<span class="combo-opt${k===0&&qq?' on':''}" role="option" data-v="${esc(x.v)}">${esc(x.l)}${x.tag?` <em>${x.tag}</em>`:''}</span>`).join(''):'<span class="combo-empty">一致する曲がありません</span>';
  list.hidden=false;inp.setAttribute('aria-expanded','true');
}
function comboClose(inp,restore){const list=inp.parentNode.querySelector('.combo-list');list.hidden=true;inp.setAttribute('aria-expanded','false');if(restore)inp.value=inp.dataset.prev}
function comboPick(inp,v){
  if(inp.id==='chSongSel')state.ui.chSong=v;else state.ui.song=v;
  save();render();
}
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList?.contains('songpick')){t.value='';comboOpen(t,'')}});
document.addEventListener('input',e=>{const t=e.target;if(t.classList?.contains('songpick'))comboOpen(t,t.value)});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList?.contains('songpick'))setTimeout(()=>{if(document.activeElement!==t)comboClose(t,true)},150)});
// 曲リストの外をクリック・タップしたら閉じる（入力中の文字は確定前の曲名に戻す）
document.addEventListener('pointerdown',e=>{if(e.target.closest?.('.combo'))return;
  document.querySelectorAll('.combo .combo-list:not([hidden])').forEach(l=>{const inp=l.parentNode.querySelector('.songpick');comboClose(inp,true);if(document.activeElement===inp)inp.blur()})},true);
document.addEventListener('mousedown',e=>{
  const o=e.target.closest?.('.combo-opt');if(o){e.preventDefault();comboPick(o.closest('.combo').querySelector('.songpick'),o.dataset.v);return}
  const b=e.target.closest?.('[data-combo-btn]');if(b){e.preventDefault();const inp=document.getElementById(b.dataset.comboBtn);if(document.activeElement===inp){comboClose(inp,true);inp.blur()}else inp.focus()}
});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.classList?.contains('songpick'))return;const list=t.parentNode.querySelector('.combo-list');const os=[...list.querySelectorAll('.combo-opt')];let k=os.findIndex(o=>o.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden)comboOpen(t,t.value);if(!os.length)return;k=e.key==='ArrowDown'?Math.min(os.length-1,k+1):Math.max(0,k-1);os.forEach((o,i)=>o.classList.toggle('on',i===k));os[k].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();const o=os[k>=0?k:0];if(o)comboPick(t,o.dataset.v)}
  else if(e.key==='Escape'){comboClose(t,true);t.blur()}});
load();render();
</script>
