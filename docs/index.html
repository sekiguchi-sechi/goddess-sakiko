const arr5=s=>{const a=String(s||'').split(/[,\s、]+/).filter(x=>x!=='').map(Number);if(!a.length)return null;while(a.length<5)a.push(a[a.length-1]);return a};

  if(r.card){any=true;const nz=x=>String(x||'').normalize('NFKC');if(!nz(c.name).includes(nz(r.card)))return false}
  if(r.chara){any=true;if(c.chara!==r.chara)return false}

  if(r.band){any=true;if(c.band!==r.band&&!(kind==='snap'&&!c.band))return false}

function evBonus(c,kind){
  const idx=Math.max(0,Math.min(4,kind==='member'?c.awak|0:c.lb|0));
  // メンバーのボーナス合計は pt に、スナップのボーナス合計はアイテムに掛かる
  const o={pt:0,item:0,param:0};const key=kind==='member'?'pt':'item';
  for(const r of state.event.rules){if(!ruleMatch(r,c,kind))continue;
    const b=arr5(r.bonus);if(b)o[key]+=b[idx]||0;
    const p=arr5(r.param);if(p)o.param+=p[idx]||0}
  return o;
}

// ===== 計算モデル =====
// slot総合力 = B × (1 + スナップ補正 + スナップのイベント%パラ + バンドアイテム + タイプリンク + 楽曲タイプ一致 + リーダースキル)
// B = 個人総合力 × (1 + メンバーのイベント%パラ)
// 推定スコア = K × 総合力 × (1 + Σ スキル% × 効果秒 / 曲の長さ)
let M=[],S=[],CTX=null;

// 例: 祥子31・合計632 → 3×(150＋60)=630（総合力詳細「キャラランク」と一致）
const lastLE=(t,k)=>{let v=0;for(const[a,b]of t)if(a<=k)v=b;return v};
function rankBonus(chara){const R=state.settings.charaRankLv||{};const tot=CHARAS.reduce((a,c)=>a+(+R[c]||1),0);
  return 3*(lastLE(CAT.curves.crank,+R[chara]||1)+lastLE(CAT.curves.ctotal,tot))}
// ch=true のときだけイベントのパラメータボーナス（総合力アップ）を効かせる。公式ヘルプ「パラメータボーナスはチャレンジライブのみで発動」
function prep(song,ch,gkMode){
  // チャレンジライブでは課題楽曲のタイプがイベントのタイプになる（ゲーム内表示で確認。微笑みの爆弾=紫苑→山吹扱い）

  const st=state.settings, TL=st.typeLink/100, MT=st.musicType/100, TG=(st.tokui||0)/100, VIP=(st.vip||0)/100;
  M=state.members.filter(m=>!m.excl&&m.power>0).map(m=>{
    const band=CHARA_BAND[m.chara]||'';const c={...m,band};const ev=evBonus(c,'member');
    // パラメータ別の比率（P/T/V未入力なら1/3ずつ）。リーダースキルは単一パラメータ対象が多い
    const sum=(m.pP||0)+(m.pT||0)+(m.pV||0);
    const share=sum>0&&m.pP>0&&m.pT>0&&m.pV>0?{P:m.pP/sum,T:m.pT/sum,V:m.pV/sum}:{P:1/3,T:1/3,V:1/3};
    // ゲームと同じく Pfm・Tec・Vis ごとに計算する（par）。キャラランク加算は3パラメータに等分、イベントのパラメータ%は切り捨て
    const rb=rankBonus(m.chara),ep=(ch?ev.param:0)/100,raw=sum>0&&m.pP>0&&m.pT>0&&m.pV>0?[m.pP,m.pT,m.pV]:[m.power/3,m.power/3,m.power/3];
    const awk=(m.awak|0)+1,smT=((stype==='all'||stype===m.type)?MT:0)*awk,smG=(song.band&&song.band===band?TG*awk:0);
    return{...c,ev,share,par:raw.map(x=>x+flr(x*ep)+rb/3),smT,smG,B:m.power*(1+(ch?ev.param:0)/100)+rankBonus(m.chara),sk:(m.skillPct||0)/100,sec:m.skillSec||0,

      smatch:((stype==='all'||stype===m.type)?MT:0)*((m.awak|0)+1)+(song.band&&song.band===band?TG*((m.awak|0)+1):0),
      lead:(m.leader||[]).filter(l=>l.pct).map(l=>{const [k,v,v2]=String(l.cond).split(':');return{k,v,v2,s:l.stat||'all',p:l.pct/100}})};
  });

    const x=Math.min(Math.max(((m.sec||0)+ext-5)*4,0),n-1),j=Math.floor(x),f=x-j;return[0,1,2,3,4].map(k=>m.sk*(f?W[j][k]*(1-f)+W[j+1][k]*f:W[j][k]))}))}

}
// 総合力はゲームの「総合力詳細」と同じ計算: メンバーごと・パラメータ（Pfm/Tec/Vis）ごとに各ボーナスを掛けて切り捨て、足し合わせる。
// スナップ補正はスナップのパラメータ別%、リーダースキルは対象パラメータだけ（同じパラメータへの%は合計してから切り捨て）。

const flr=x=>Math.floor(x+1e-7),PTV=['P','T','V'];

function ev(t){
  const L=M[t.m[t.L]],{TL,VIP,K,T,SE,gk}=CTX;let P=0,Sk=0,pt=0,it=0,GB=0;const slots=[],ys=[];
  for(let i=0;i<5;i++){const m=M[t.m[i]],s=S[t.s[i]];
    const sp=pairPow(m,s)+leadPow(L,m),mult=sp/m.B;P+=sp;
    const ext=(s.band&&s.band===m.band)?(s.extB!=null&&s.extB!==''?+s.extB:s.ext*2):s.ext;

    let gb=0;if(gk&&s.gkType&&CTX.gkCnt[s.gkType]){const pc=(s.band&&s.band===m.band)?s.gkPctB:s.gkPct;gb=(CTX.gkCnt[s.gkType]/3)*(pc/100)*((CTX.gkEff[s.gkType]??15)/100);GB+=gb}

  }
  // 撃奏: 区間スコア＝区間比率×(1+サポート)、撃奏BONUS＝区間スコア×順位ボーナス率（1位）

  let gkMul=1,gkLoseMul=1,QL=0,gkW={};
  if(gk){const st=state.settings,lo=st.gkLoseAt??5,hi=st.gkWinAt??9,qW=(st.gkQ??160)/100,qL=(st.gkQLose??75)/100,jd=(st.gkJudge??0)/100;GB=0;let QB=0;
    for(const ty in CTX.gkCnt){const c=CTX.gkCnt[ty];if(!c)continue;
      let str=0,g=0,nj=0,ja=0;
      for(let i=0;i<5;i++){const m=M[t.m[i]],s=S[t.s[i]];if(m.gekiKind===ty)str++;if(s.gkType===ty){str++;g+=((s.band&&s.band===m.band)?s.gkPctB:s.gkPct)/100*((CTX.gkEff[ty]??10)/100);if(ty==='JUST'&&s.gkJudge)nj++;if(ty==='JUST'&&s.gkJudgeAll)ja=Math.max(ja,((s.band&&s.band===m.band)?(st.gkJudgeAll??18):(st.gkJudgeAll??18)/2)/100)}}
      // 区間全体の判定強化: 1枚目は全量、2枚目以降は半分（微笑み実績4回の比較から）
      if(ty==='JUST'){let nja2=0;for(let i=0;i<5;i++)if(S[t.s[i]].gkJudgeAll)nja2++;g+=ja*(nja2?1+0.5*(nja2-1):0)}else g+=ja;

      // JUST区間の伸びは撃奏スキルがJUSTのメンバー数でほぼ決まる（実績: 5人+0.61 / 4人+0.09〜0.18 / 2人+0.01）。判定系サポートは効果が見えなかった

function optimizeF(f){
  let best=null;const R=Math.max(1,state.settings.restarts|0);
  // 同じ最良値に何度も行き着いたら、それ以上の試行で良くなることはまずないので打ち切る
  const STOP=state.settings.stopHits??8,MIN=Math.min(R,state.settings.minRestarts??40);let hits=0;
  for(let r=0;r<R;r++){const t=randomTeam();if(!t)return null;const res=localSearch(t,f);
    if(!best||res.val>best.val+1e-9){best={t:JSON.parse(JSON.stringify(res.t)),val:res.val};hits=1}else if(Math.abs(res.val-best.val)<=1e-9)hits++;
    if(r+1>=MIN&&hits>=STOP)break}
  return canon(best.t);
}
// 並び順だけ違う同じ編成が毎回違って見えないよう、リーダーを先頭・残りはメンバー一覧順に並べ替える
function canon(t){const idx=[0,1,2,3,4].sort((a,b)=>(b===t.L)-(a===t.L)||t.m[a]-t.m[b]);
  return{...t,m:idx.map(i=>t.m[i]),s:idx.map(i=>t.s[i]),lm:idx.map(i=>t.lm[i]),ls:idx.map(i=>t.ls[i]),L:0}}
// 楽曲比較・育成優先度で同じチャレンジ編成を何度も探さないための一時キャッシュ（ツール実行中だけ使う）
let CHAL_CACHE=null;
function solve(song,obj){
  // 合計目的: 先にチャレンジ楽曲で最適なチャレンジ編成を求め、チャレンジpt 1あたりの価値を出す
  let chal=null;
  const chSong=state.ui.chSong==='none'?null:(state.songs.find(x=>x.id===state.ui.chSong)||song);
  if(obj==='chscore'){if(!chSong)return{error:'チャレンジ楽曲を選んでください。'};song=chSong}
  const ck=chSong&&(chSong.id+'|'+obj);if(CHAL_CACHE&&ck&&ck in CHAL_CACHE)chal=CHAL_CACHE[ck];
  else if((obj==='ptTotal'||obj==='itemTotal')&&chSong){const keep=state.settings.chMult;state.settings.chMult=1;
    const cr=solve(chSong,obj==='ptTotal'?'chpt':'chitem');state.settings.chMult=keep;
    if(cr.best){const e=ev({...cr.best.t,detail:true});
      chal={song:chSong.name,rank:RANKS[cr.best.rank],score:e.score,lo:e.lo,hi:e.hi,pt:e.pt,it:e.it,P:e.P,per1600:cr.best.val*8,vpc:cr.best.val/200,
        slots:e.slots.map((x,i)=>slotRow(x,i===cr.best.t.L))};}
  }
  if(CHAL_CACHE&&ck&&(obj==='ptTotal'||obj==='itemTotal'))CHAL_CACHE[ck]=chal;
  // チャレンジ編成を探したかキャッシュから取ったかで乱数の進み方が変わらないよう、本探索は同じ種からやり直す（全曲比較と最適化タブで同じ編成になる）
  if(obj==='ptTotal'||obj==='itemTotal')seedRnd(SEED0);
  if(obj==='gkscore'&&!song.gkTypes?.length)return{error:'この曲は撃奏ライブのデータ（撃奏区間の種類）がありません。'};
  prep(song,obj==='chpt'||obj==='chitem'||obj==='chscore',obj==='gkscore');CTX.vpc=chal?chal.vpc:0;CTX.wantMax=obj==='maxscore';
  if(M.length<5)return{error:'メンバーが5人未満です（除外中を含めて確認してください）。'};
  if(state.settings.uniqueChara&&new Set(M.map(m=>m.chara)).size<5)return{error:'キャラ重複不可の設定で、異なるキャラが5人そろいません。'};
  const pack=t=>{const e=ev({...t,detail:true});const rank=rankOf(e.lo,song);return{t,e,rank,val:value(obj,e,rank)}};
  if(obj==='score'||obj==='maxscore'||obj==='chscore'||obj==='gkscore'||obj==='power'){
    // 撃奏: 区間の種類が1種類の曲は、勝てる編成の条件（撃奏スキル持ちの人数・JUSTは区間全体の判定幅スナップ）を満たす中で最大を探す
    // 条件は実戦で全勝できた編成から（JUST: JUSTスキル4人＋判定幅2枚、COMBO: COMBOスキル4人、LUCK: LUCKスキル2人）
    let f=obj==='power'?e=>e.P:obj==='maxscore'?e=>e.max:e=>e.score;
    // 区間の種類が混ざった曲（全部入り）でも、JUST区間があれば判定幅スナップを最低1枚入れる（無いと実戦でJUSTが取りにくい）
    if(obj==='gkscore'&&state.settings.gkReq!==false){const ty=new Set(song.gkTypes||[]),st=state.settings;if(ty.size===1){const k=[...ty][0];
      const need=({JUST:st.gkNeedJ??4,COMBO:st.gkNeedC??4,LUCK:st.gkNeedL??2})[k]||0,nj=k==='JUST'?(st.gkNeedJudge??2):0;
      f=e=>{const sh=Math.max(0,need-((e.mk||{})[k]||0))+Math.max(0,nj-(e.nj||0));return e.score*(sh?0.5-0.05*sh:1)}}
      else if(ty.has('JUST')){const nj=st.gkNeedJudgeMix??1;f=e=>{const sh=Math.max(0,nj-(e.nj||0));return e.score*(sh?0.5-0.05*sh:1)}}}
    const t=optimizeF(f);return{best:pack(t),frontier:[],chal,songId:song.id};
  }
  const bonusKey=(obj==='pt'||obj==='chpt'||obj==='ptTotal')?'pt':'it';
  const frontier=[];let topT=null;
  // 目標ランクごとに「必要スコアを満たす中でボーナス最大」を探す
  for(let r=0;r<RANKS.length;r++){
    const th=r===0?0:song.thr?.[RANKS[r]];if(r>0&&!(th>0))continue;const need=th/lowF();
    // 制約なし（ボーナス最大）の編成がすでに届いているランクは、同じ編成が答えなので探索を省く
    if(r>0&&frontier.length&&frontier[0].e.lo>=need)continue;
    // 主目的のボーナスが同じなら、もう一方のボーナス（pt↔アイテム）が高い編成を選ぶ
    const sub=bonusKey==='pt'?'it':'pt';
    const f0=e=>e.lo>=need?1e15+e[bonusKey]*1e6+e.lo*1e-3:e.lo;
    const f=e=>e.lo>=need?1e15+e[bonusKey]*1e6+e[sub]*1e2+e.lo*1e-5:e.lo;
    // 副目的を入れると局所解に落ちやすいので、主目的だけの探索結果も候補にして良い方を採る
    // f0の結果からfで仕上げ探索もして、3つのうち最良を採る
    const t1=optimizeF(f0),t2=optimizeF(f),t3=canon(localSearch(JSON.parse(JSON.stringify(t1)),f).t);
    // 出発点を増やす: 他のランクで見つけた編成と、スコア最大の編成（必要スコアを満たしやすい）から局所探索する。
    // ランダムな出発点だけだと、ボーナスの高い編成に必要スコアを割らずに移れない局所解に止まることがある
    const cands=[t1,t2,t3];
    if(state.settings.warmStart!==false&&r>0){if(!topT)topT=optimizeF(e=>e.lo);
      for(const w of [topT,...frontier.map(p=>p.t)])cands.push(canon(localSearch(JSON.parse(JSON.stringify(w)),f).t))}
    // 緩めた探索: 必要スコアを少し割るのを罰金つきで許してボーナスを上げ、罰金を段階的に重くして必要スコアに戻す
    // （メンバー1人とスナップ2枚を同時に替えないと届かない編成への道。罰金は不足1%あたり lam ポイント）
    if(r>0&&state.settings.relax!==false){let w=JSON.parse(JSON.stringify(cands.reduce((a,b)=>f(evq(b))>f(evq(a))?b:a)));
      for(const lam of (state.settings.relax||[3,10,30,100,300])){const g=e=>e[bonusKey]+e[sub]*1e-4-Math.max(0,need-e.lo)/need*lam*100+e.lo/need*1e-6;w=localSearch(w,g).t}
      cands.push(canon(localSearch(w,f).t))}
    const t=polish2(cands.reduce((a,b)=>f(evq(b))>f(evq(a))?b:a),f);const p=pack(t);
    if(p.e.lo>=need)frontier.push({...p,target:r,need});
  }
  // 同じ編成の重複を除く
  const seen=new Set();const fr=frontier.filter(p=>{const k=Math.round(p.e.score)+'|'+p.e.pt+'|'+p.e.it;if(seen.has(k))return false;seen.add(k);return true});
  fr.sort((a,b)=>b.target-a.target);
  // 価値が同じなら、もう一方のボーナス→スコアの高い方（同点の選び方で毎回結果が変わらないように）
  const sub=bonusKey==='pt'?'it':'pt';
  const best=fr.reduce((a,b)=>!a||b.val>a.val||(b.val===a.val&&(b.e[sub]>a.e[sub]||(b.e[sub]===a.e[sub]&&b.e.score>a.e.score)))?b:a,null);
  return{best,frontier:fr,bonusKey,chal,songId:song.id};
}

function ordKpis(R,P,e){if(!e.ord)return'';const song=state.songs.find(s=>s.id===R.songId)||curSong(),O=e.ord,n=O.length;

  const rr=[P.rank,P.rank+1].filter(r=>r>0&&r<RANKS.length).map(r=>[r,reach(r)]).filter(([r,c])=>c!=null&&(c>0||r===P.rank));
  return`<div class="kpi wide"><div class="k">発動順120通りの最低〜最高</div><div class="v" style="font-size:17px">${fmt(O[0].s)} 〜 ${fmt(O[n-1].s)}</div></div>

  return`<div class="fgroup"><span class="flabel">${label}</span>${items.map(([v,l])=>`<button type="button" class="fchip${typed?' chip t-'+esc(v):''}${sel.includes(v)?' on':''}" data-cft="${key}" data-v="${esc(v)}" aria-pressed="${sel.includes(v)}">${esc(l)}</button>`).join('')}${sel.length?`<button type="button" class="fclear" data-cft="${key}" data-v="">解除</button>`:''}</div>`}
function pass(r,c){const f=cardFilter();const own=!!(r&&r.own);if(f.own==='own'&&!own)return false;if(f.own==='not'&&own)return false;if(f.band.length&&!f.band.includes(c.band))return false;if(f.rarity.length&&!f.rarity.includes(c.rarity))return false;if(f.type.length&&!f.type.includes(c.type))return false;return true}
const fmtLead=L=>L.map(([c,st,p])=>`${c==='all'?'全員':c.replace(/^(band|type|chara|skill|geki|bandtype):/,'').replace(':','・')} ${({all:'全',P:'P',T:'T',V:'V'})[st]}+${p}%`).join('／')||'—';
function emptyNote(kind){return Object.values(state.roster[kind]).some(r=>r.own)?'':`<div class="banner"><b>まだ所持カードがありません。</b><span class="muted">「表示」を「全カード」にして、持っているカードの「所持」にチェックを入れてください。</span><button class="btn small" data-act="showAll">全カードを表示</button></div>`}
function viewMembers(){
  const rows=sortCards(CAT.members,'m').filter(c=>pass(state.roster.m[c.id],c)).map(c=>{
    const r0=state.roster.m[c.id],r=r0||{...newMR(c),own:0},own=!!r.own,[P,T,V]=mStats(c,r);const e=evBonus({name:c.title,chara:c.chara,band:c.band,type:c.type,awak:r.rk-1},'member');
    return`<tr data-kind="cm" data-id="${c.id}" class="${own?'':'dim'}">
    <td><input data-f="own" type="checkbox"${own?' checked':''}></td>
    <td><input data-f="lock" type="checkbox"${r.lock?' checked':''}${own?'':' disabled'} title="必ず入れる"></td>
    <td><input data-f="excl" type="checkbox"${r.excl?' checked':''}${own?'':' disabled'} title="使わない"></td>
    <td>${esc(c.chara)}</td><td>${esc(c.title)}</td><td>${c.rarity}</td><td>${chip(c.type)}</td>
    <td style="white-space:nowrap"><input data-f="lv" type="number" min="1" max="${c.lim[r.tr-1]}" value="${r.lv}" style="width:58px"><span class="muted">/${c.lim[r.tr-1]}</span></td>
    <td><select data-f="tr">${opts(n5,r.tr)}</select></td><td><select data-f="rk">${opts(n5,r.rk)}</select></td>
    <td><select data-f="sl">${opts(n5,r.sl)}</select></td><td><select data-f="gl">${opts(n5,r.gl)}</select></td>
    <td class="num">${fmt(P+T+V)}<div class="muted mono" style="font-size:11px">${P}/${T}/${V}</div></td>
    <td style="font-size:12px">${esc(fmtLead(c.leader[r.rk-1]))}</td>
    <td style="font-size:12px;white-space:nowrap">${c.liveKind} ${c.live[r.sl-1]}%</td><td>${c.geki}</td>
    <td class="num" style="font-size:12px">${e.pt||e.param?`pt+${e.pt}% / パラ+${e.param}%`:'—'}</td></tr>`}).join('');
  return`<div class="stack"><section class="panel stack">
    <h2 style="margin:0">メンバー</h2>
    <p class="note">ゲームの全カードが並んでいます。持っているカードの「所持」にチェックを入れ、メンバー詳細の <b>Lv・特訓・覚醒・ライブスキルLv・撃奏スキルLv</b> を合わせてください。総合力やスキルの値は自動で計算されます。未所持のカードは編成に入りません（値は覚えておけます）。</p>
    ${filterBar('m')}</section>${emptyNote('m')}
  <div class="tbl"><table><thead><tr><th>所持</th><th>固定</th><th>除外</th><th>キャラ</th><th>カード名</th><th>レア</th><th>タイプ</th><th>Lv</th><th>特訓</th><th>覚醒</th><th>スキルLv</th><th>撃奏Lv</th><th class="num">総合力</th><th>リーダースキル</th><th>ライブスキル</th><th>撃奏</th><th>イベント補正</th></tr></thead>
  <tbody>${rows}</tbody></table></div></div>`;
}
function viewSnaps(){
  const rows=sortCards(CAT.snaps,'s').filter(c=>pass(state.roster.s[c.id],c)).map(c=>{
    const r0=state.roster.s[c.id],r=r0||{...newSR(c),own:0},own=!!r.own,[cP,cT,cV]=sStats(c,r),sk=c.rk[r.rk-1],ex=c.ext[sk[1]-1]||[0,0],g=c.gk[sk[2]-1]||[0,0];
    const e=evBonus({name:c.title,chara:c.chara,band:c.band,type:c.type,lb:r.rk-1},'snap');
    return`<tr data-kind="cs" data-id="${c.id}" class="${own?'':'dim'}">
    <td><input data-f="own" type="checkbox"${own?' checked':''}></td>
    <td><input data-f="lock" type="checkbox"${r.lock?' checked':''}${own?'':' disabled'}></td>
    <td><input data-f="excl" type="checkbox"${r.excl?' checked':''}${own?'':' disabled'}></td>
    <td>${esc(c.title)}</td><td>${c.rarity}</td><td>${chip(c.type)}</td><td style="font-size:12px">${esc(c.band||'—')}</td><td>${esc(c.chara||'—')}</td>
    <td style="white-space:nowrap"><input data-f="lv" type="number" min="1" max="${sk[0]}" value="${r.lv}" style="width:58px"><span class="muted">/${sk[0]}</span></td>
    <td><select data-f="rk">${opts(n5,r.rk)}</select></td>
    <td class="mono" style="font-size:12px;white-space:nowrap">${cP}/${cT}/${cV}%</td>
    <td style="font-size:12px">${ex[0]?`${ex[0]}秒（一致${ex[1]}秒）`:'—'}</td>
    <td style="font-size:12px">${c.gkType||'—'} ${g[0]?`${g[0]}%（一致${g[1]}%）`:''}${c.gkJudgeAll?' 判定幅':''}</td>
    <td class="num" style="font-size:12px">${e.item||e.param?`アイテム+${e.item}% / パラ+${e.param}%`:'—'}</td></tr>`}).join('');
  return`<div class="stack"><section class="panel stack">
    <h2 style="margin:0">スナップ</h2>
    <p class="note">持っているスナップの「所持」にチェックを入れ、スナップ詳細の <b>Lv・上限解放</b> を合わせてください。補正%・延長秒・撃奏サポートは自動で計算されます。</p>
    ${filterBar('s')}</section>${emptyNote('s')}
  <div class="tbl"><table><thead><tr><th>所持</th><th>固定</th><th>除外</th><th>スナップ名</th><th>レア</th><th>タイプ</th><th>バンド</th><th>キャラ</th><th>Lv</th><th>上限解放</th><th>補正 P/T/V</th><th>スキル延長</th><th>撃奏サポート</th><th>イベント補正</th></tr></thead>
  <tbody>${rows}</tbody></table></div></div>`;
}

function exportData(){
  const pick=(r,fs)=>Object.fromEntries(fs.filter(f=>r[f]!=null&&!(f==='lock'||f==='excl')||r[f]).map(f=>[f,+r[f]]));
  const m={},sn={};
  for(const c of CAT.members){const r=state.roster.m[c.id];if(r&&r.own)m[c.title]=pick(r,['own','lv','tr','rk','sl','gl','lock','excl'])}
  for(const c of CAT.snaps){const r=state.roster.s[c.id];if(r&&r.own)sn[c.title]=pick(r,['own','lv','rk','lock','excl'])}
  const st=state.settings;
  return{format:'ournotes-deck/1',settings:{charaRankLv:{...st.charaRankLv},bandItem:{...st.bandItem},vip:st.vip||0},roster:{m,s:sn}}}

    <h3>バンドアイテム %（各バンドの能力UP合計）</h3>
    <div class="row">${BAND_NAMES.map(b=>`<label class="f">${esc(b)}<input type="number" data-set="bandItem.${b}" value="${st.bandItem[b]}" step="0.1"></label>`).join('')}</div>
    <h3>撃奏ライブ（推定）</h3>
    <div class="row"><label class="f">撃奏BONUS 1位時 %<input type="number" data-set="gkQ" value="${st.gkQ??160}" step="5"></label><label class="f">撃奏BONUS 負け時 %<input type="number" data-set="gkQLose" value="${st.gkQLose??75}" step="5"></label><label class="f">区間全体の判定強化（まぶたをおろして等）バンド一致時 %<input type="number" data-set="gkJudgeAll" value="${st.gkJudgeAll??18}" step="1"></label><label class="f">JUSTスキル持ち1人あたり（3.5人超の分）%<input type="number" data-set="gkJustMem" value="${st.gkJustMem??10}" step="5"></label>
    ${['COMBO','JUST','LUCK'].map(k=>`<label class="f">${k}スコアUPサポート100%あたり %<input type="number" data-set="gkEff.${k}" value="${(st.gkEff||{})[k]??''}" step="1"></label>`).join('')}</div>
    <p class="note">撃奏サポートの「スコア○%UP」は、その種類の撃奏区間でだけ効きます。撃奏スコア ＝ フリー相当 ×（1＋G）×（1＋撃奏BONUS比）。G＝区間に合うスコアUPサポートの効果（COMBO・LUCK）＋JUST区間では撃奏スキルがJUSTのメンバー数による上乗せ（5人で約+45%、4人で+15%、3人以下はほぼ0）。判定強化のうち、JUST区間のあいだずっと効くもの（まぶたをおろして・ちえりが褒めます！！）はバンド一致で+18%（不一致は半分）。区間の最初の5秒だけのものは効果が見えなかったので0です。撃奏BONUS比は区間1位で約1.5、負けると約0.75。勝敗は一緒になる相手で決まり、編成からは予測できなかった（強さ6で全勝・9で全敗の実績あり）ため、最適化は全区間1位を前提にし、負けた場合のスコアも併記します。</p>
    <h3>キャラクターランク（総合力に固定で加算）</h3>
    <p class="note">1人あたりの加算 ＝ 3 ×（本人のランクの値＋全キャラのランク合計の値）。値はゲームのマスターデータの表で自動計算します（例：ランク31・合計632なら 3×(150＋60)＝630）。いまのランク合計：${CHARAS.reduce((a,c)=>a+(+st.charaRankLv?.[c]||1),0)}</p>

    <h3>ランク別の基礎獲得量</h3>

  </section>
  <section class="panel stack"><h2>データの保存・移行（テキスト）</h2>
    <p class="note">入力はこのブラウザに自動保存されます。別の端末へ移すときや控えを取るときは、下のJSONをコピーして保存し、読み込み欄に貼り付けてください。</p>
    <div class="row"><button class="btn small" data-act="exportJson">JSONを表示</button><button class="btn small" data-act="copyJson">コピー</button><button class="btn small" data-act="importJson">貼り付けたJSONを読み込む</button><button class="btn small" data-act="loadSample">サンプルに戻す</button></div>
    <textarea id="json" rows="8" placeholder="ここにJSONを貼り付けて「読み込む」"></textarea>
    <p id="jsonMsg" class="note"></p>
  </section>
  <section class="panel stack"><h2>計算モデルと出典</h2>
    <ul class="note" style="margin:0;padding-left:18px">
      <li>枠の総合力＝個人総合力×(1+メンバーのイベントパラ%)×(1＋スナップ補正%＋スナップのイベントパラ%＋バンドアイテム%＋タイプリンク%（スナップ覚醒×5%）＋タイプボーナス%（曲タイプ一致・メンバー覚醒×5%）＋得意楽曲%（持ち歌バンド・メンバー覚醒×5%）＋T.G.W CARD%＋リーダースキル%×対象パラメータの比率)。ゲームの「総合力詳細」の内訳（メンバー＋リーダースキル＋スナップ＋バンドアイテム＋キャラランク＋タイプリンク＋T.G.W CARD）と同じ足し算の形です。キャラランクの固定加算（5人で数千程度）は省略しています。</li>
      <li>推定スコア（フリー・チャレンジ）＝総合力×(base＋x̄×W)×全体補正。bdon.moe のモデルで、base は曲ごとのスキルなし全PERFECTのスコア÷総合力、W はスキル発動枠5つの重みの合計、x̄ は5人の「スキル%×(5秒＋延長秒)/5秒」の平均。スキルは1曲5回、メンバー順はライブごとにランダム（120通り）なので、順番による±のばらつきも計算し、悪い順番（既定1.28σ＝下位約10%）でも届くランクで判定します。全体補正1.005は実測6回の平均。撃奏ライブと、bdon.moe にデータの無い曲は従来の K×総合力×(1＋実効係数×Σスキル%×秒/曲長) です。</li>
      <li>ランクは閾値×(1＋安全マージン)で判定。pt・アイテムは同一ランク内ならスコアで増えないので、ランクを保ったままボーナスを最大化します。</li>
      <li>出典：<a href="https://github.com/empty-sekai/ournotes-deck" target="_blank" rel="noopener">empty-sekai/ournotes-deck</a>（クライアント準拠の計算式）、<a href="https://minemineaoao.hippy.jp/ourno/eventguide.html" target="_blank" rel="noopener">minemineaoao氏 イベント攻略（基礎値・ボーナス表）</a>、<a href="https://appmedia.jp/bang-dream-on/80441902" target="_blank" rel="noopener">AppMedia イベント解説</a>、<a href="https://gamerch.com/bang-dream-on/1017723" target="_blank" rel="noopener">Gamerch</a>、<a href="https://bdon.moe/en/tools/deck" target="_blank" rel="noopener">bdon.moe Deck builder</a>。</li>
    </ul>
  </section></div>`;
}

// JSON取り込み: 全体のバックアップ（songs と roster を含む）なら置き換え、それ以外は書いてある項目だけ上書き
function importData(o){
  if(!o||typeof o!=='object')throw 0;
  if(o.roster&&o.songs){state=o;normalize();return'すべてのデータを読み込みました。'}
  if(!o.roster&&!o.settings&&!Array.isArray(o.members))throw 0;
  if(Array.isArray(o.members)&&!o.roster){state=o;normalize();return'読み込みました。'}
  let n=0;
  const byName={m:Object.fromEntries(CAT.members.map(c=>[c.title,c])),s:Object.fromEntries(CAT.snaps.map(c=>[c.title,c]))};
  for(const k of ['m','s'])for(const [key,r] of Object.entries(o.roster?.[k]||{})){const c=(k==='m'?CM:CSN)[key]||byName[k][key];if(!c)continue;const id=c.id;
    const cur=state.roster[k][id]||(k==='m'?newMR(c):newSR(c));for(const f of (k==='m'?['own','lv','tr','rk','sl','gl','lock','excl']:['own','lv','rk','lock','excl']))if(r[f]!=null)cur[f]=+r[f];
    clampR(k,c,cur);cur.ed=1;state.roster[k][id]=cur;n++}
  const st=o.settings||{};
  if(st.charaRankLv)for(const[c,v]of Object.entries(st.charaRankLv))if(CHARAS.includes(c))state.settings.charaRankLv[c]=+v;
  if(st.bandItem)for(const[b,v]of Object.entries(st.bandItem))if(BAND_NAMES.includes(b))state.settings.bandItem[b]=+v;
  if(st.vip!=null)state.settings.vip=+st.vip;
  materialize();return`読み込みました（カード${n}枚${o.settings?'・プレイヤー情報':''}）。`}

function setPath(o,path,val){const ps=path.split('.');let x=o;for(let i=0;i<ps.length-1;i++){x[ps[i]]??={};x=x[ps[i]]}x[ps.at(-1)]=val}
document.addEventListener('click',e=>{

        dl.save({filename:name,data}).then(()=>msg('書き出しました。'),e=>msg(e&&e.code==='declined'?'保存を取りやめました。':'書き出せませんでした。下の「JSONを表示」から控えを取ってください。'))});return}

    case'addSong':{const s={id:uid(),name:'新しい曲',type:'all',len:120,K:4.5,thr:{}};state.songs.push(s);break}
    case'loadEvent':{const id=document.getElementById('evPreset').value;state.event=myEvent(id);pickChSong(state.event);lastResult=null;break}
    case'addRule':state.event.rules.push({id:uid(),label:'',card:'',chara:'',band:'',type:'',target:'both',bonus:'',param:''});break;
    case'resetSettings':{const k=state.settings;state.settings={...defaultSettings(),charaRankLv:k.charaRankLv,bandItem:k.bandItem,vip:k.vip};break}

    case'copyJson':{const ta=document.getElementById('json');if(!ta.value)ta.value=JSON.stringify(state,null,1);
      navigator.clipboard?.writeText(ta.value).then(()=>msg('コピーしました。'),()=>{ta.select();msg('自動コピーできないため選択しました。Ctrl+Cでコピーしてください。')});return}
    case'importJson':try{const o=JSON.parse(document.getElementById('json').value);if(!o.roster&&!Array.isArray(o.members))throw 0;state=o;normalize();lastResult=null;save();render();msg('読み込みました。')}catch(_){msg('JSONとして読めませんでした。「JSONを表示」で出した形式のまま貼り付けてください。')}return;
  }
  save();render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='obj'){state.ui.obj=el.value;save();render();return}
  if(el.id==='cmpObj'){state.ui.cmpObj=el.value;save();render();return}
  if(el.id==='songSel'||el.id==='chSongSel')return;
  if(el.id==='lb'){state.settings.lb=+el.value;save();if(lastResult&&!lastResult.error)document.getElementById('result').innerHTML=renderResult();return}
  if(el.id==='chMult'){state.settings.chMult=+el.value;save();if(lastResult&&!lastResult.error)document.getElementById('result').innerHTML=renderResult();return}
  if(el.id==='margin'){state.settings.margin=+el.value||0;save();return}
  if(el.id==='gkJust'){state.settings.gkJust=Math.max(0,Math.min(100,+el.value||0));save();return}
  if(el.id==='evName'){state.event.name=el.value;save();return}
  if(el.dataset.set){const k=el.dataset.set;const v=el.type==='checkbox'?el.checked:+el.value;setPath(state.settings,k,v);lastResult=null;save();if(state.ui.tab==='members')render();return}
  if(el.dataset.cf){cardFilter()[el.dataset.cf]=el.value;save();render();return}
  if(el.id==='songQ'){state.ui.songQ=el.value;save();render();document.getElementById('songQ')?.focus();return}
  if(el.id==='importFile'){const fl=el.files&&el.files[0];if(!fl)return;fl.text().then(t=>{try{const m=importData(JSON.parse(t));lastResult=null;save();render();alert(m)}catch(_){alert('このファイルは読み込めませんでした。')}});el.value='';return}
  const ctr=el.closest('tr[data-kind="cm"],tr[data-kind="cs"]');
  if(ctr&&el.dataset.f){const k=ctr.dataset.kind==='cm'?'m':'s',id=ctr.dataset.id,c=(k==='m'?CM:CSN)[id],f=el.dataset.f;
    let r=state.roster[k][id];if(!r){r=state.roster[k][id]=k==='m'?newMR(c):newSR(c);r.own=0}
    const old=r[f];if(f==='own'||f==='lock'||f==='excl')r[f]=el.checked?1:0;else r[f]=+el.value;
    // 特訓・上限解放を変えたとき、Lvが前の上限ちょうどなら新しい上限に合わせる
    if(f==='tr'&&k==='m'&&r.lv===c.lim[old-1])r.lv=c.lim[r.tr-1];
    if(f==='rk'&&k==='s'&&r.lv===c.rk[old-1][0])r.lv=c.rk[r.rk-1][0];
    clampR(k,c,r);r.ed=1;materialize();lastResult=null;save();render();return}
  const tr=el.closest('tr[data-kind]');if(!tr||!el.dataset.f)return;
  const item=listOf(tr.dataset.kind).find(x=>x.id===tr.dataset.id);if(!item)return;
  const f=el.dataset.f;let v=el.type==='checkbox'?el.checked:(el.dataset.n!==undefined?(el.value===''?'':+el.value):el.value);
  if(f.startsWith('thr.')){item.thr||={};item.thr[f.slice(4)]=v===''?0:v}
  else item[f]=v;
  lastResult=null;save();
  if(['chara','type','name','band','target','card','bonus','param'].includes(f))render();
});

// ===== 楽曲のコンボボックス（入力すれば検索、空欄なら全曲の一覧） =====
const NO_CH='なし（チャレンジライブ無し）';
function comboHtml(id,val){return`<span class="combo"><input id="${id}" class="songpick" value="${esc(val)}" data-prev="${esc(val)}" autocomplete="off" role="combobox" aria-expanded="false" placeholder="曲名を入力（空欄で一覧）"><button type="button" class="combo-btn" data-combo-btn="${id}" tabindex="-1" aria-label="一覧を開く">▾</button><span class="combo-list" role="listbox" hidden></span></span>`}
function comboItems(id){
  const nz=x=>x.normalize('NFKC').toLowerCase();
  const songs=state.songs.map(x=>({v:x.id,l:x.name}));
  if(id!=='chSongSel')return songs;
  const ch=(state.event.chSongs||[]).map(n=>state.songs.find(x=>x.name.startsWith(n))).filter(Boolean).map(x=>({v:x.id,l:x.name,tag:'課題楽曲'}));
  const chIds=new Set(ch.map(x=>x.v));
  return[{v:'none',l:NO_CH},...ch,...songs.filter(x=>!chIds.has(x.v))];
}
// 撃奏区間の種類（例 JUST・JUST・JUST）。同じ種類だけなら「JUST×3」

function comboClose(inp,restore){const list=inp.parentNode.querySelector('.combo-list');list.hidden=true;inp.setAttribute('aria-expanded','false');if(restore)inp.value=inp.dataset.prev}
function comboPick(inp,v){
  if(inp.id==='chSongSel')state.ui.chSong=v;else state.ui.song=v;
  save();render();
}
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList?.contains('songpick')){t.value='';comboOpen(t,'')}});
document.addEventListener('input',e=>{const t=e.target;if(t.classList?.contains('songpick'))comboOpen(t,t.value)});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList?.contains('songpick'))setTimeout(()=>{if(document.activeElement!==t)comboClose(t,true)},150)});
// 曲リストの外をクリック・タップしたら閉じる（入力中の文字は確定前の曲名に戻す）
document.addEventListener('pointerdown',e=>{if(e.target.closest?.('.combo'))return;
  document.querySelectorAll('.combo .combo-list:not([hidden])').forEach(l=>{const inp=l.parentNode.querySelector('.songpick');comboClose(inp,true);if(document.activeElement===inp)inp.blur()})},true);
document.addEventListener('mousedown',e=>{
  const o=e.target.closest?.('.combo-opt');if(o){e.preventDefault();comboPick(o.closest('.combo').querySelector('.songpick'),o.dataset.v);return}
  const b=e.target.closest?.('[data-combo-btn]');if(b){e.preventDefault();const inp=document.getElementById(b.dataset.comboBtn);if(document.activeElement===inp){comboClose(inp,true);inp.blur()}else inp.focus()}
});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.classList?.contains('songpick'))return;const list=t.parentNode.querySelector('.combo-list');const os=[...list.querySelectorAll('.combo-opt')];let k=os.findIndex(o=>o.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(list.hidden)comboOpen(t,t.value);if(!os.length)return;k=e.key==='ArrowDown'?Math.min(os.length-1,k+1):Math.max(0,k-1);os.forEach((o,i)=>o.classList.toggle('on',i===k));os[k].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();const o=os[k>=0?k:0];if(o)comboPick(t,o.dataset.v)}
  else if(e.key==='Escape'){comboClose(t,true);t.blur()}});
load();render();
</script>
</body></html>
